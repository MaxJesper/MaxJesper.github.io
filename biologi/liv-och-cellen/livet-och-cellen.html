<style>
  /* ===== Spelets egna stilar (scoped under #spel) ===== */
  #spel{
    --gron:#2e8b6f; --gron-m:#3fae8b; --gron-l:#e6f5ef;
    --bla:#3b7dd8; --bla-l:#e8f1fc;
    --gul:#f0a500; --gul-l:#fff4dd;
    --ratt:#2e9e5b; --ratt-l:#e4f6ea;
    --fel:#d64545; --fel-l:#fce8e8;
    --ink:#243033; --mut:#5c6b6e; --linje:#dfe6e4;
    max-width:760px; margin:1rem auto 3rem; color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  #spel *{box-sizing:border-box}
  #spel .kort{
    background:#fff;border:1px solid var(--linje);border-radius:18px;
    padding:1.6rem;box-shadow:0 4px 20px rgba(36,48,51,.06);
  }

  /* Toppinfo: poäng + progress */
  #spel .hud{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem;flex-wrap:wrap}
  #spel .hud .del-namn{font-weight:700;font-size:1.05rem}
  #spel .hud .poang{margin-left:auto;background:var(--gul-l);color:#9a6b00;
    font-weight:700;padding:.35rem .8rem;border-radius:999px;font-size:.95rem}
  #spel .streak{background:var(--gron-l);color:var(--gron);font-weight:700;
    padding:.35rem .8rem;border-radius:999px;font-size:.95rem}
  #spel .progress{height:9px;background:#eef1f0;border-radius:999px;overflow:hidden;margin-bottom:1.4rem}
  #spel .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--gron-m),var(--gron));width:0;transition:width .35s ease}

  /* Frågekort */
  #spel .fraga{font-size:1.3rem;font-weight:600;line-height:1.35;margin:0 0 .4rem}
  #spel .instruktion{color:var(--mut);margin:0 0 1.2rem}

  /* Svarsknappar */
  #spel .val{display:grid;gap:.7rem}
  #spel .val.tva{grid-template-columns:1fr 1fr}
  @media(max-width:520px){#spel .val.tva{grid-template-columns:1fr}}
  #spel button.svar{
    text-align:left;background:#fff;border:2px solid var(--linje);border-radius:14px;
    padding:.95rem 1.1rem;font-size:1.05rem;color:var(--ink);cursor:pointer;
    transition:border-color .12s,background .12s,transform .05s;font-family:inherit;
  }
  #spel button.svar:hover:not(:disabled){border-color:var(--gron-m);background:var(--gron-l)}
  #spel button.svar:active:not(:disabled){transform:scale(.99)}
  #spel button.svar.ratt{border-color:var(--ratt);background:var(--ratt-l);font-weight:600}
  #spel button.svar.fel{border-color:var(--fel);background:var(--fel-l)}
  #spel button.svar:disabled{cursor:default;opacity:1}

  /* Feedback */
  #spel .feedback{margin-top:1.1rem;padding:1rem 1.1rem;border-radius:14px;display:none;line-height:1.45}
  #spel .feedback.visa{display:block}
  #spel .feedback.bra{background:var(--ratt-l);border:1px solid #b7e2c5}
  #spel .feedback.oj{background:var(--fel-l);border:1px solid #f0bcbc}
  #spel .feedback b{display:block;margin-bottom:.15rem}
  #spel .nasta{margin-top:1rem;display:flex;justify-content:flex-end}
  #spel button.knapp{
    background:var(--gron);color:#fff;border:none;border-radius:999px;
    padding:.7rem 1.6rem;font-size:1.02rem;font-weight:600;cursor:pointer;font-family:inherit;
  }
  #spel button.knapp:hover{background:#26745c}
  #spel button.knapp.sekundar{background:#fff;color:var(--gron);border:2px solid var(--gron)}
  #spel button.knapp.sekundar:hover{background:var(--gron-l)}

  /* Startmeny */
  #spel .val-niva{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.4rem}
  @media(max-width:560px){#spel .val-niva{grid-template-columns:1fr}}
  #spel .niva-kort{
    border:2px solid var(--linje);border-radius:16px;padding:1.3rem;cursor:pointer;
    background:#fff;transition:border-color .12s,transform .08s,box-shadow .12s;
  }
  #spel .niva-kort:hover{border-color:var(--gron-m);transform:translateY(-2px);box-shadow:0 8px 22px rgba(36,48,51,.08)}
  #spel .niva-kort .emoji{font-size:2rem}
  #spel .niva-kort h3{margin:.4rem 0 .3rem;font-size:1.2rem}
  #spel .niva-kort p{margin:0;color:var(--mut);font-size:.96rem;line-height:1.4}
  #spel .start-alla{margin-top:1rem;text-align:center}

  /* SVG-cell (klicka på delen) */
  #spel .cell-scen{background:var(--bla-l);border-radius:16px;padding:.6rem;margin-bottom:.4rem}
  #spel svg .del{cursor:pointer;transition:opacity .12s}
  #spel svg .del:hover{opacity:.75}
  #spel svg .del.traff{stroke:#1c7a44 !important;stroke-width:5 !important}
  #spel svg .del.traff *:not(.hit){stroke:#1c7a44 !important;stroke-width:4 !important}
  #spel .cell-etikett{text-align:center;color:var(--mut);font-size:.85rem;margin:.2rem 0 0}

  /* Slutbild */
  #spel .slut{text-align:center}
  #spel .slut .emoji{font-size:3rem}
  #spel .slut h2{font-size:1.7rem;margin:.4rem 0}
  #spel .slut .resultat{font-size:1.15rem;color:var(--mut);margin-bottom:.4rem}
  #spel .slut .snurra{font-size:1.05rem;margin:1rem 0 1.4rem;font-weight:600;color:var(--gron)}
  #spel .slut-knappar{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
</style>
</head>

/* =========================================================
   SPELMOTOR
   ========================================================= */
const spel = document.getElementById("spel");
let ko = [], index = 0, poang = 0, streak = 0, besvarad = false, delnamn = "";

function blanda(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function start(){
  spel.innerHTML = `
    <div class="kort">
      <h2 style="margin:.2rem 0 .4rem;font-size:1.5rem">Välkommen! 🔬</h2>
      <p style="color:#5c6b6e;margin:0 0 .2rem;line-height:1.5">
        Det här spelet har två delar. Välj var du vill börja – eller kör allt på en gång.
      </p>
      <div class="val-niva">
        <div class="niva-kort" onclick="korDel(1)">
          <div class="emoji">🌱</div>
          <h3>Del 1 – Vad är liv?</h3>
          <p>Livets sex kännetecken, levande eller inte, och cellen som livets minsta del.</p>
        </div>
        <div class="niva-kort" onclick="korDel(2)">
          <div class="emoji">🧫</div>
          <h3>Del 2 – Cellens delar</h3>
          <p>Organellerna i djur- och växtceller, vad de gör och var de finns.</p>
        </div>
      </div>
      <div class="start-alla">
        <button class="knapp" onclick="korDel(0)">▶ Spela hela spelet</button>
      </div>
    </div>`;
}

function korDel(vilken){
  if(vilken===1){ ko = blanda(del1); delnamn = "Del 1 – Vad är liv?"; }
  else if(vilken===2){ ko = blanda(del2); delnamn = "Del 2 – Cellens delar"; }
  else { ko = blanda(del1).concat(blanda(del2)); delnamn = "Hela spelet"; }
  index = 0; poang = 0; streak = 0;
  visaFraga();
}

function visaFraga(){
  besvarad = false;
  const f = ko[index];
  const totalt = ko.length;
  const procent = Math.round((index)/totalt*100);

  let svarHtml = "";
  if(f.typ==="sort"){
    svarHtml = `<div class="val tva">` +
      f.knappar.map((k,i)=>`<button class="svar" onclick="svara(${i})">${k}</button>`).join("") +
      `</div>`;
  } else if(f.typ==="mc"){
    const ordning = blanda(f.val.map((v,i)=>i));
    svarHtml = `<div class="val">` +
      ordning.map(i=>`<button class="svar" data-i="${i}" onclick="svara(${i})">${f.val[i]}</button>`).join("") +
      `</div>`;
  } else if(f.typ==="hotspot"){
    const cellSvg = f.cell==="djur" ? svgDjurcell() : svgVaxtcell();
    svarHtml = `<div class="cell-scen">${cellSvg}</div>
      <p class="cell-etikett">${f.cell==="djur"?"Djurcell":"Växtcell"}</p>`;
  }

  spel.innerHTML = `
    <div class="kort">
      <div class="hud">
        <span class="del-namn">${delnamn}</span>
        <span class="streak">Fråga ${index+1} / ${totalt}</span>
        <span class="poang">⭐ ${poang} p</span>
      </div>
      <div class="progress"><i style="width:${procent}%"></i></div>
      <p class="fraga">${f.fraga}</p>
      <p class="instruktion">${f.instr}${f.typ==="sort"?`<br><b style="color:#243033;font-size:1.15rem">${f.text}</b>`:""}</p>
      ${svarHtml}
      <div class="feedback" id="fb"></div>
      <div class="nasta" id="nasta"></div>
    </div>`;

  if(f.typ==="hotspot"){
    spel.querySelectorAll("svg .del").forEach(el=>{
      el.addEventListener("click",()=>klickDel(el));
    });
  }
}

function svara(valt){
  if(besvarad) return;
  besvarad = true;
  const f = ko[index];
  const ratt = (valt===f.ratt);
  registrera(ratt);

  spel.querySelectorAll("button.svar").forEach(b=>{
    b.disabled = true;
    const bi = b.dataset.i!==undefined ? Number(b.dataset.i) : [...b.parentNode.children].indexOf(b);
    if(bi===f.ratt) b.classList.add("ratt");
    else if(bi===valt) b.classList.add("fel");
  });
  visaFeedback(ratt, f);
}

function klickDel(el){
  if(besvarad) return;
  const f = ko[index];
  const id = el.dataset.id;
  if(id===f.mal){
    besvarad = true;
    el.classList.add("traff");
    spel.querySelectorAll("svg .del").forEach(d=>d.style.pointerEvents="none");
    registrera(true);
    visaFeedback(true, f);
  } else {
    // fel del: blinka rött, men låt eleven försöka igen
    el.style.transition="none";
    const original = el.getAttribute("stroke");
    el.setAttribute("stroke","#d64545");
    el.setAttribute("stroke-width","6");
    setTimeout(()=>{ el.style.transition=""; el.setAttribute("stroke",original); el.removeAttribute("stroke-width"); el.setAttribute("stroke-width","4"); },450);
    const fb = document.getElementById("fb");
    fb.className="feedback oj visa";
    fb.innerHTML = `<b>Inte riktigt 🤔</b>Det där var inte ${f.malnamn.toLowerCase()}. Titta en gång till och prova igen.`;
  }
}

function registrera(ratt){
  if(ratt){ streak++; poang += 10 + Math.min(streak-1,5)*2; }
  else { streak = 0; }
}

function visaFeedback(ratt, f){
  const fb = document.getElementById("fb");
  fb.className = "feedback visa " + (ratt?"bra":"oj");
  fb.innerHTML = (ratt
      ? `<b>Rätt! ✅${streak>=3?` &nbsp;🔥 ${streak} i rad!`:""}</b>`
      : `<b>Inte riktigt ❌</b>`) + f.forkl;
  const nasta = document.getElementById("nasta");
  const sista = (index === ko.length-1);
  nasta.innerHTML = `<button class="knapp" onclick="framat()">${sista?"Se resultat":"Nästa fråga →"}</button>`;
}

function framat(){
  if(index < ko.length-1){ index++; visaFraga(); }
  else visaSlut();
}

function visaSlut(){
  const totalt = ko.length;
  const max = 0; // beräknas ej exakt (streakbonus) – visa poäng + andel rätt via poang/bas
  // uppskatta antal rätt: varje rätt ger minst 10 p; enklare att räkna rätt separat vore bättre,
  // men vi visar poäng och en peppande kommentar utifrån poäng/fråga.
  const snitt = poang / totalt;
  let emoji, titel, snurra;
  if(snitt >= 11){ emoji="🏆"; titel="Cellmästare!"; snurra="Fantastiskt jobbat – du kan det här!"; }
  else if(snitt >= 8){ emoji="🌟"; titel="Snyggt jobbat!"; snurra="Du har bra koll. Kör en runda till och sikta ännu högre!"; }
  else if(snitt >= 5){ emoji="👍"; titel="Bra början!"; snurra="Du är på gång. Läs förklaringarna och prova igen!"; }
  else { emoji="🌱"; titel="Fortsätt öva!"; snurra="Öva lite till – varje runda gör dig bättre. Du fixar det!"; }

  spel.innerHTML = `
    <div class="kort slut">
      <div class="emoji">${emoji}</div>
      <h2>${titel}</h2>
      <p class="resultat">Du fick <b>${poang} poäng</b> på ${totalt} frågor.</p>
      <p class="snurra">${snurra}</p>
      <div class="slut-knappar">
        <button class="knapp" onclick="start()">▶ Spela igen</button>
        <button class="knapp sekundar" onclick="location.href='./larande-spel.html'">Till lärande spel</button>
      </div>
    </div>`;
}

// starta
start();
</script>
