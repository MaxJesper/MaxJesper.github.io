<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="title">Blodet är mer än röda blodkroppar</title><desc id="desc">Fyra åtskilda exempel: blodplasma, en röd blodkropp utan kärna, en vit blodkropp med kärna och små blodplättar. Röda blodkroppens ljusare mitt är en fördjupning, inte ett hål. Bilden visar inte verkliga antal eller ett mikroskopfoto.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#006b70"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8b162b"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#ffffff"/></marker></defs><rect width="1600" height="900" fill="#f5f8fa"/><text x="75" y="100" font-family="DejaVu Sans, sans-serif" font-size="47" fill="#193346" text-anchor="start">Blodet är mer än röda blodkroppar</text><rect x="75" y="150" width="1450" height="142" rx="24" fill="white" stroke="#becbd3" stroke-width="2"/><text x="350" y="204" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#193346" text-anchor="start">Blodplasma</text><text x="350" y="254" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#506574" text-anchor="start">Vätska med lösta ämnen</text><g id="plasma"><rect x="125" y="175" width="170" height="92" rx="24" fill="#f3e6ba" stroke="#becbd3" stroke-width="2"/></g><rect x="75" y="314" width="1450" height="142" rx="24" fill="white" stroke="#becbd3" stroke-width="2"/><text x="350" y="368" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#193346" text-anchor="start">Röda blodkroppar</text><text x="350" y="418" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#506574" text-anchor="start">Transporterar syre</text><g id="red-cell"><circle cx="205" cy="384" r="50" fill="#8b162b" stroke="#5e0917" stroke-width="3"/><circle cx="205" cy="384" r="24.0" fill="#d98c98" stroke="none" stroke-width="1"/></g><rect x="75" y="478" width="1450" height="142" rx="24" fill="white" stroke="#becbd3" stroke-width="2"/><text x="350" y="532" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#193346" text-anchor="start">Vita blodkroppar</text><text x="350" y="582" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#506574" text-anchor="start">Deltar i immunförsvaret</text><g id="white-cell"><circle cx="205" cy="548" r="61" fill="#e8e1f0" stroke="#716084" stroke-width="3"/><circle cx="190" cy="543" r="22" fill="#716084" stroke="none" stroke-width="1"/><circle cx="222" cy="558" r="22" fill="#716084" stroke="none" stroke-width="1"/></g><rect x="75" y="642" width="1450" height="142" rx="24" fill="white" stroke="#becbd3" stroke-width="2"/><text x="350" y="696" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#193346" text-anchor="start">Blodplättar</text><text x="350" y="746" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#506574" text-anchor="start">Cellbitar som hjälper till att stoppa blödning</text><g id="platelets"><circle cx="175" cy="700" r="12" fill="#716084" stroke="none" stroke-width="1"/><circle cx="230" cy="714" r="10" fill="#716084" stroke="none" stroke-width="1"/><circle cx="200" cy="738" r="9" fill="#716084" stroke="none" stroke-width="1"/></g><text x="75" y="852" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#506574" text-anchor="start">Schematisk illustration • inte ett mikroskopfoto eller en bild av verkliga antal</text></svg>