<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="title">Tre kärltyper – tre uppgifter</title><desc id="desc">Artärer leder från hjärtat, ett kapillärnät möjliggör utbyte, och vener leder till hjärtat. Pilarna visar blodets riktning från vänster till höger. Bilden är en ordningsmodell, inte en skalenlig bild av kroppen.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#006b70"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8b162b"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#ffffff"/></marker></defs><rect width="1600" height="900" fill="#f5f8fa"/><text x="75" y="100" font-family="DejaVu Sans, sans-serif" font-size="47" fill="#193346" text-anchor="start">Tre kärltyper – tre uppgifter</text><g id="card-1"><rect x="75" y="170" width="440" height="535" rx="24" fill="white" stroke="#becbd3" stroke-width="2"/><text x="295" y="235" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#193346" text-anchor="middle">Artärer</text><text x="295" y="620" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#193346" text-anchor="middle">från hjärtat</text></g><g id="card-2"><rect x="580" y="170" width="440" height="535" rx="24" fill="white" stroke="#becbd3" stroke-width="2"/><text x="800" y="235" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#193346" text-anchor="middle">Kapillärer</text><text x="800" y="620" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#193346" text-anchor="middle">utbyte med vävnaden</text></g><g id="card-3"><rect x="1085" y="170" width="440" height="535" rx="24" fill="white" stroke="#becbd3" stroke-width="2"/><text x="1305" y="235" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#193346" text-anchor="middle">Vener</text><text x="1305" y="620" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#193346" text-anchor="middle">till hjärtat</text></g><g id="artery"><rect x="115" y="370" width="360" height="150" rx="16" fill="#e5b6bd"/><rect x="115" y="410" width="360" height="70" fill="#8b162b"/><path d="M165 445 L425 445" stroke="#ffffff" stroke-width="6" fill="none" marker-end="url(#white)"/></g><g id="bed"><path d="M620 445 C695 445 700 350 785 350 C870 350 870 445 950 445" fill="none" stroke="#8b162b" stroke-width="10"/><path d="M620 445 C700 445 700 405 785 405 C870 405 870 445 950 445" fill="none" stroke="#8b162b" stroke-width="10"/><path d="M620 445 H950" fill="none" stroke="#8b162b" stroke-width="10"/><path d="M620 445 C695 445 700 495 785 495 C870 495 870 445 950 445" fill="none" stroke="#8b162b" stroke-width="10"/><path d="M620 445 C695 445 700 550 785 550 C870 550 870 445 950 445" fill="none" stroke="#8b162b" stroke-width="10"/><path d="M750 445 L825 445" stroke="#8b162b" stroke-width="6" fill="none" marker-end="url(#red)"/></g><g id="vein"><rect x="1125" y="375" width="360" height="140" rx="16" fill="#e5b6bd"/><rect x="1125" y="390" width="360" height="110" fill="#8b162b"/><path d="M1170 445 L1440 445" stroke="#ffffff" stroke-width="6" fill="none" marker-end="url(#white)"/></g><text x="75" y="780" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#506574" text-anchor="start">Schematisk ordning • mindre artärer och vener är utelämnade</text></svg>