<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="title">Byggnaden passar uppgiften</title><desc id="desc">Artären har tjockare muskelvägg än venen. Kapillären visas med ett tunt lager endotel och basalmembran, kraftigt förstorat. Väggen består av ett enda lager platta celler (cellkärnorna syns som små utbuktningar). Alla kärlens blod är rött. Diametrarna får inte jämföras, eftersom förstoringarna skiljer sig.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#006b70"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8b162b"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#ffffff"/></marker></defs><rect width="1600" height="900" fill="#f5f8fa"/><text x="75" y="100" font-family="DejaVu Sans, sans-serif" font-size="47" fill="#193346" text-anchor="start">Byggnaden passar uppgiften</text><text x="290" y="225" font-family="DejaVu Sans, sans-serif" font-size="39" fill="#193346" text-anchor="middle">Artär</text><g id="artery-wall"><circle cx="290" cy="435" r="150" fill="#d2bdbe" stroke="none" stroke-width="1"/><circle cx="290" cy="435" r="130" fill="#e5b6bd" stroke="none" stroke-width="1"/><circle cx="290" cy="435" r="86" fill="#f6e8eb" stroke="none" stroke-width="1"/><circle cx="290" cy="435" r="80" fill="#8b162b" stroke="none" stroke-width="1"/></g><text x="290" y="620" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#193346" text-anchor="middle">Tjock muskel- och</text><text x="290" y="660" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#193346" text-anchor="middle">elastisk vägg</text><text x="800" y="225" font-family="DejaVu Sans, sans-serif" font-size="39" fill="#193346" text-anchor="middle">Ven</text><g id="vein-wall"><circle cx="800" cy="435" r="150" fill="#d2bdbe" stroke="none" stroke-width="1"/><circle cx="800" cy="435" r="138" fill="#e5b6bd" stroke="none" stroke-width="1"/><circle cx="800" cy="435" r="128" fill="#f6e8eb" stroke="none" stroke-width="1"/><circle cx="800" cy="435" r="122" fill="#8b162b" stroke="none" stroke-width="1"/></g><text x="800" y="620" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#193346" text-anchor="middle">Tunnare vägg</text><text x="1310" y="225" font-family="DejaVu Sans, sans-serif" font-size="39" fill="#193346" text-anchor="middle">Kapillär</text><g id="capillary-wall"><circle cx="1310" cy="435" r="103" fill="#b2c9cc" stroke="none" stroke-width="1"/><circle cx="1310" cy="435" r="98" fill="#f5e6e8" stroke="none" stroke-width="1"/><circle cx="1310" cy="435" r="86" fill="#8b162b" stroke="none" stroke-width="1"/><ellipse cx="1310" cy="343" rx="17" ry="6" fill="#7a5c6a"/><ellipse cx="1390" cy="481" rx="6" ry="16" transform="rotate(-30 1390 481)" fill="#7a5c6a"/><ellipse cx="1228" cy="481" rx="6" ry="16" transform="rotate(30 1228 481)" fill="#7a5c6a"/></g><text x="1310" y="662" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#506574" text-anchor="middle">Extra förstorat</text><text x="1310" y="620" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#193346" text-anchor="middle">Väggen: ett enda lager celler</text><text x="75" y="765" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#193346" text-anchor="start">Tvärsnitt • blodet är rött även i vener</text><text x="75" y="822" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#506574" text-anchor="start">Olika förstoringar. Jämför väggarnas byggnad, inte kärlens diameter.</text></svg>