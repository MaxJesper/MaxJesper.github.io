<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="title">Kapillärer: här sker utbytet</title><desc id="desc">En kapillär med röda blodkroppar och tunna väggar. En pil visar syre från blodet mot kroppens vävnad och en annan koldioxid från vävnaden mot blodet. Detta är vävnadens kapillärer, inte lungornas. Röda blodkroppar stannar i kärlet.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#006b70"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8b162b"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#ffffff"/></marker></defs><rect width="1600" height="900" fill="#f5f8fa"/><text x="75" y="100" font-family="DejaVu Sans, sans-serif" font-size="47" fill="#193346" text-anchor="start">Kapillärer: här sker utbytet</text><rect x="100" y="330" width="1400" height="142" rx="10" fill="#fae9ec"/><text x="100" y="300" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#193346" text-anchor="start">Blod i kapillären</text><g id="walls"><rect x="100" y="330" width="1400" height="20" fill="#b7cdd0"/><rect x="100" y="452" width="1400" height="20" fill="#b7cdd0"/></g><g id="rbc-235"><circle cx="235" cy="401" r="48" fill="#8b162b" stroke="#5e0917" stroke-width="3"/><circle cx="235" cy="401" r="23" fill="#d98c98" stroke="none" stroke-width="1"/></g><g id="rbc-445"><circle cx="445" cy="401" r="48" fill="#8b162b" stroke="#5e0917" stroke-width="3"/><circle cx="445" cy="401" r="23" fill="#d98c98" stroke="none" stroke-width="1"/></g><g id="rbc-655"><circle cx="655" cy="401" r="48" fill="#8b162b" stroke="#5e0917" stroke-width="3"/><circle cx="655" cy="401" r="23" fill="#d98c98" stroke="none" stroke-width="1"/></g><g id="rbc-865"><circle cx="865" cy="401" r="48" fill="#8b162b" stroke="#5e0917" stroke-width="3"/><circle cx="865" cy="401" r="23" fill="#d98c98" stroke="none" stroke-width="1"/></g><g id="rbc-1075"><circle cx="1075" cy="401" r="48" fill="#8b162b" stroke="#5e0917" stroke-width="3"/><circle cx="1075" cy="401" r="23" fill="#d98c98" stroke="none" stroke-width="1"/></g><g id="rbc-1285"><circle cx="1285" cy="401" r="48" fill="#8b162b" stroke="#5e0917" stroke-width="3"/><circle cx="1285" cy="401" r="23" fill="#d98c98" stroke="none" stroke-width="1"/></g><path d="M1260 290 L1440 290" stroke="#8b162b" stroke-width="6" fill="none" marker-end="url(#red)"/><g id="oxygen"><path d="M550 405 L550 650" stroke="#006b70" stroke-width="6" fill="none" marker-end="url(#arr)"/><text x="510" y="710" font-family="DejaVu Sans, sans-serif" font-size="33" fill="#193346" text-anchor="start">Syre</text></g><g id="carbon-dioxide"><path d="M970 650 L970 405" stroke="#006b70" stroke-width="6" fill="none" marker-end="url(#arr)"/><text x="900" y="710" font-family="DejaVu Sans, sans-serif" font-size="33" fill="#193346" text-anchor="start">Koldioxid</text></g><g id="tissue"><rect x="110" y="735" width="1380" height="60" rx="24" fill="#eef3ed" stroke="#becbd3" stroke-width="2"/><text x="800" y="777" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#193346" text-anchor="middle">Kroppens vävnad och celler</text></g><text x="75" y="855" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#506574" text-anchor="start">Schematisk förstoring • blodkropparna passerar en och en och stannar normalt i kärlet</text></svg>