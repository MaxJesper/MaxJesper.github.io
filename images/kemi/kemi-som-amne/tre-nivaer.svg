<title id="t">Tre nivåer i kemin: makro, partikel och symbol</title>
<desc id="d">Tre rutor ovanför varandra. Överst vatten i en bägare, det man ser och mäter. I mitten vattenmolekyler ritade som cirklar med bokstäverna O och H, alltså partikelnivån. Nederst symbolen H2O(l) och formeln för densitet.</desc>
