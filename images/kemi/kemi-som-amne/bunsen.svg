<title id="t">Bunsenbrännare med luftringen stängd och öppen</title>
<desc id="d">Två bunsenbrännare. Till vänster är luftringen stängd och lågan är gul, lång och sotar. Till höger är luftringen öppen och lågan är blå, kortare och hetare. Delar som är utmärkta: rör, luftring, gasslang och fot.</desc>
