<title id="t">Så avläser du volymen i en mätcylinder</title>
<desc id="d">En mätcylinder med vätska. Ett öga står i höjd med vätskeytan och en streckad linje går till den lägsta punkten av den böjda ytan, meniskus. En förstoring visar att man läser av vid den nedersta punkten.</desc>
