<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Löslighet och temperatur</title>
<desc id="d">Diagram med temperatur på x-axeln och hur mycket som går att lösa på y-axeln. En heldragen kurva för fasta ämnen stiger med temperaturen. En streckad kurva för gaser sjunker med temperaturen.</desc>
<line x1="80.0" y1="280.0" x2="600.0" y2="280.0" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
<line x1="80.0" y1="30.0" x2="80.0" y2="280.0" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
<text x="600.0" y="314.0" font-size="14" text-anchor="end" font-weight="600" fill="#1f2937" >temperatur  →</text>
<text x="28.0" y="155.0" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2937" transform="rotate(-90 28 155.0)">hur mycket som går att lösa</text>
<text x="84.0" y="300.0" font-size="13" text-anchor="start" font-weight="400" fill="#475569" >kallt</text>
<text x="540.0" y="300.0" font-size="13" text-anchor="end" font-weight="400" fill="#475569" >varmt</text>
<path d="M100,240 Q300,210 580,70" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<path d="M100,70 Q280,180 580,240" fill="none" stroke="#c2410c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 7" />
<text x="300.0" y="78.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1d4ed8" >Fasta ämnen (t.ex. socker)</text>
<text x="300.0" y="96.0" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937" >heldragen linje: löser mer när det är varmt</text>
<text x="410.0" y="236.0" font-size="14" text-anchor="middle" font-weight="700" fill="#c2410c" >Gaser (t.ex. koldioxid)</text>
<text x="410.0" y="254.0" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937" >streckad linje: löser mindre när det är varmt</text>
</svg>
