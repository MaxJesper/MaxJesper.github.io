<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Värmekurva för vatten</title>
<desc id="d">Diagram med tid på x-axeln och temperatur på y-axeln. Kurvan stiger från minus 20 grader till noll grader, planar ut vid noll grader medan isen smälter, stiger till hundra grader, planar ut vid hundra grader medan vattnet kokar och stiger sedan igen som vattenånga.</desc>
