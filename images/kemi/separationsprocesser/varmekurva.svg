<text x="116.0" y="250.1" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937" >värms</text>
<text x="220.0" y="237.4" font-size="15" text-anchor="middle" font-weight="700" fill="#c2410c" >Smältning</text>
<text x="220.0" y="275.4" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2937" >is + vatten</text>
