<text x="380.0" y="40.0" font-size="15" text-anchor="start" font-weight="700" fill="#1f2937" >1  Vätskan värms tills den kokar.</text>
<text x="380.0" y="64.0" font-size="15" text-anchor="start" font-weight="700" fill="#1f2937" >2  Ångan stiger och leds in i röret.</text>
<text x="380.0" y="88.0" font-size="15" text-anchor="start" font-weight="700" fill="#1f2937" >3  I kylaren kyls ångan och blir flytande igen.</text>
<text x="380.0" y="112.0" font-size="15" text-anchor="start" font-weight="700" fill="#1f2937" >4  Destillatet droppar ned i bägaren.</text>
<text x="20.0" y="62.0" font-size="13" text-anchor="start" font-weight="600" fill="#475569" >Termometern visar ångans</text>
<text x="20.0" y="78.0" font-size="13" text-anchor="start" font-weight="600" fill="#475569" >temperatur (= kokpunkten)</text>
