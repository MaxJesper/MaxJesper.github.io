<title id="t">Destillation</title>
<desc id="d">En kolv med vätska värms över en låga. Ångan går genom ett rör till en kylare där den kyls och blir flytande. Den kondenserade vätskan, destillatet, droppar ned i en bägare. Kylvatten går in nedtill och ut upptill i kylaren.</desc>
