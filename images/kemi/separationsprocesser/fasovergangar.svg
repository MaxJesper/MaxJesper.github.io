<title id="t">Fasövergångar mellan fast, flytande och gas</title>
<desc id="d">Tre rutor i rad: fast, flytande, gas. Pilar åt höger: smältning respektive avdunstning eller kokning. Pilar åt vänster: stelning respektive kondensering. En båge över toppen visar sublimering direkt från fast till gas, en under visar det omvända.</desc>
