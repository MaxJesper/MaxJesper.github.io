<title id="t">Sedimentering och dekantering</title>
<desc id="d">Tre steg. 1: en bägare med grumligt vatten där korn virvlar runt. 2: bägaren har fått stå och kornen har sjunkit till botten så att vattnet ovanför är klart. 3: det klara vattnet hälls försiktigt över i en ny bägare medan kornen blir kvar.</desc>
