<line x1="740.0" y1="186.0" x2="740.0" y2="215.0" stroke="#334155" stroke-width="3" stroke-linecap="round" />
<polygon points="740.0,224.0 735.0,215.0 745.0,215.0" fill="#334155" stroke="#334155" stroke-width="1" stroke-linejoin="round" />
<line x1="604.0" y1="290.0" x2="593.0" y2="290.0" stroke="#334155" stroke-width="3" stroke-linecap="round" />
<polygon points="584.0,290.0 593.0,285.1 593.0,294.9" fill="#334155" stroke="#334155" stroke-width="1" stroke-linejoin="round" />
<line x1="314.0" y1="290.0" x2="303.0" y2="290.0" stroke="#334155" stroke-width="3" stroke-linecap="round" />
<polygon points="294.0,290.0 303.0,285.1 303.0,294.9" fill="#334155" stroke="#334155" stroke-width="1" stroke-linejoin="round" />
<text x="30.0" y="36.0" font-size="15" text-anchor="start" font-weight="700" fill="#475569" >Avloppsvatten in  →</text>
<line x1="160.0" y1="356.0" x2="160.0" y2="373.0" stroke="#334155" stroke-width="3" stroke-linecap="round" />
<polygon points="160.0,382.0 155.1,373.0 164.9,373.0" fill="#334155" stroke="#334155" stroke-width="1" stroke-linejoin="round" />
<text x="176.0" y="376.0" font-size="15" text-anchor="start" font-weight="700" fill="#475569" >Renat vatten ut</text>
</svg>
