<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Avloppsvatten renas i flera steg</title>
<desc id="d">Ett flödesschema med sex steg: rensgaller, sandfång, försedimentering, biologisk rening, kemisk fällning och slutligen sedimentering med filter. Varje steg tar bort något som skiljer sig i storlek, densitet eller löslighet, och renat vatten lämnar verket.</desc>
<rect x="30.0" y="60.0" width="260.0" height="120.0" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5" />
<circle cx="52.0" cy="86.0" r="11" fill="#1f2937" stroke="#fff" stroke-width="1.5" />
<text x="52.0" y="90.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" >1</text>
<text x="72.0" y="92.0" font-size="17" text-anchor="start" font-weight="700" fill="#1f2937" >Rensgaller</text>
<text x="46.0" y="122.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" >stora föremål fastnar</text>
<text x="46.0" y="140.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" >i gallret</text>
<text x="46.0" y="166.0" font-size="13.5" text-anchor="start" font-weight="700" fill="#0e7490" >skiljer på: storlek</text>
<rect x="320.0" y="60.0" width="260.0" height="120.0" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5" />
<circle cx="342.0" cy="86.0" r="11" fill="#1f2937" stroke="#fff" stroke-width="1.5" />
<text x="342.0" y="90.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" >2</text>
<text x="362.0" y="92.0" font-size="17" text-anchor="start" font-weight="700" fill="#1f2937" >Sandfång</text>
<text x="336.0" y="122.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" >sand och grus sjunker</text>
<text x="336.0" y="140.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" >till botten</text>
<text x="336.0" y="166.0" font-size="13.5" text-anchor="start" font-weight="700" fill="#0e7490" >skiljer på: densitet</text>
<rect x="610.0" y="60.0" width="260.0" height="120.0" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5" />
<circle cx="632.0" cy="86.0" r="11" fill="#1f2937" stroke="#fff" stroke-width="1.5" />
<text x="632.0" y="90.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" >3</text>
<text x="652.0" y="92.0" font-size="17" text-anchor="start" font-weight="700" fill="#1f2937" >Försedimentering</text>
<text x="626.0" y="122.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" >slam sjunker till</text>
<text x="626.0" y="140.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" >bassängens botten</text>
<text x="626.0" y="166.0" font-size="13.5" text-anchor="start" font-weight="700" fill="#0e7490" >skiljer på: densitet</text>
<rect x="610.0" y="230.0" width="260.0" height="120.0" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5" />
<circle cx="632.0" cy="256.0" r="11" fill="#1f2937" stroke="#fff" stroke-width="1.5" />
<text x="632.0" y="260.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" >4</text>
<text x="652.0" y="262.0" font-size="17" text-anchor="start" font-weight="700" fill="#1f2937" >Biologisk rening</text>
<text x="626.0" y="292.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" >bakterier bryter ned</text>
<text x="626.0" y="310.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" >lösta ämnen</text>
<text x="626.0" y="336.0" font-size="13.5" text-anchor="start" font-weight="700" fill="#0e7490" >skiljer på: omvandling</text>
<rect x="320.0" y="230.0" width="260.0" height="120.0" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5" />
<circle cx="342.0" cy="256.0" r="11" fill="#1f2937" stroke="#fff" stroke-width="1.5" />
<text x="342.0" y="260.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" >5</text>
<text x="362.0" y="262.0" font-size="17" text-anchor="start" font-weight="700" fill="#1f2937" >Kemisk fällning</text>
<text x="336.0" y="292.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" >fosfor fälls ut som</text>
<text x="336.0" y="310.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" >fast ämne (flingor)</text>
<text x="336.0" y="336.0" font-size="13.5" text-anchor="start" font-weight="700" fill="#0e7490" >skiljer på: löslighet</text>
<rect x="30.0" y="230.0" width="260.0" height="120.0" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5" />
<circle cx="52.0" cy="256.0" r="11" fill="#1f2937" stroke="#fff" stroke-width="1.5" />
<text x="52.0" y="260.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" >6</text>
<text x="72.0" y="262.0" font-size="17" text-anchor="start" font-weight="700" fill="#1f2937" >Sedimentering, filter</text>
<text x="46.0" y="292.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" >flingorna sjunker</text>
<text x="46.0" y="310.0" font-size="14" text-anchor="start" font-weight="400" fill="#1f2937" >eller silas bort</text>
<text x="46.0" y="336.0" font-size="13.5" text-anchor="start" font-weight="700" fill="#0e7490" >skiljer på: densitet, storlek</text>
<line x1="294.0" y1="120.0" x2="305.0" y2="120.0" stroke="#334155" stroke-width="3" stroke-linecap="round" />
<polygon points="314.0,120.0 305.0,125.0 305.0,115.0" fill="#334155" stroke="#334155" stroke-width="1" stroke-linejoin="round" />
