<title id="t">Tre sorters blandningar: slamning, emulsion och lösning</title>
<desc id="d">Tre bägare. Slamning: fasta korn virvlar runt i vatten och en del har sjunkit. Emulsion: små droppar av en vätska svävar i en annan. Lösning: mycket små partiklar är jämnt fördelade och syns inte.</desc>
