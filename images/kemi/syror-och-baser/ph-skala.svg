<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 65 900 235" role="img" aria-label="pH-skalan från 0 till 14. Under 7 är lösningen sur, 7 är neutralt och över 7 är lösningen basisk. Exempel: saltsyra ungefär 0, magsaft 1 till 2, citron ungefär 2, cola och läsk 2,5 till 3, surt regn ungefär 5, rent vatten 7, bakpulver 8 till 9, hushållsammoniak ungefär 11 och natronlut ungefär 14."><defs><pattern id="ph-str" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/></pattern><pattern id="ph-pri" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.5" fill="#ffffff" fill-opacity="0.45"/></pattern></defs><rect x="40.0" y="140" width="54.7" height="46" fill="#9a3412" stroke="#ffffff" stroke-width="1.5"/><rect x="40.0" y="140" width="54.7" height="46" fill="url(#ph-str)"/><text x="67.3" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">0</text><rect x="94.7" y="140" width="54.7" height="46" fill="#c2410c" stroke="#ffffff" stroke-width="1.5"/><rect x="94.7" y="140" width="54.7" height="46" fill="url(#ph-str)"/><text x="122.0" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">1</text><rect x="149.3" y="140" width="54.7" height="46" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/><rect x="149.3" y="140" width="54.7" height="46" fill="url(#ph-str)"/><text x="176.7" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">2</text><rect x="204.0" y="140" width="54.7" height="46" fill="#f97316" stroke="#ffffff" stroke-width="1.5"/><rect x="204.0" y="140" width="54.7" height="46" fill="url(#ph-str)"/><text x="231.3" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">3</text><rect x="258.7" y="140" width="54.7" height="46" fill="#fb923c" stroke="#ffffff" stroke-width="1.5"/><rect x="258.7" y="140" width="54.7" height="46" fill="url(#ph-str)"/><text x="286.0" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#14213d">4</text><rect x="313.3" y="140" width="54.7" height="46" fill="#fdba74" stroke="#ffffff" stroke-width="1.5"/><rect x="313.3" y="140" width="54.7" height="46" fill="url(#ph-str)"/><text x="340.7" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#14213d">5</text><rect x="368.0" y="140" width="54.7" height="46" fill="#fed7aa" stroke="#ffffff" stroke-width="1.5"/><rect x="368.0" y="140" width="54.7" height="46" fill="url(#ph-str)"/><text x="395.3" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#14213d">6</text><rect x="422.7" y="140" width="54.7" height="46" fill="#f3f4f6" stroke="#ffffff" stroke-width="1.5"/><text x="450.0" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#14213d">7</text><rect x="477.3" y="140" width="54.7" height="46" fill="#bfdbfe" stroke="#ffffff" stroke-width="1.5"/><rect x="477.3" y="140" width="54.7" height="46" fill="url(#ph-pri)"/><text x="504.7" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#14213d">8</text><rect x="532.0" y="140" width="54.7" height="46" fill="#93c5fd" stroke="#ffffff" stroke-width="1.5"/><rect x="532.0" y="140" width="54.7" height="46" fill="url(#ph-pri)"/><text x="559.3" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#14213d">9</text><rect x="586.7" y="140" width="54.7" height="46" fill="#60a5fa" stroke="#ffffff" stroke-width="1.5"/><rect x="586.7" y="140" width="54.7" height="46" fill="url(#ph-pri)"/><text x="614.0" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#14213d">10</text><rect x="641.3" y="140" width="54.7" height="46" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/><rect x="641.3" y="140" width="54.7" height="46" fill="url(#ph-pri)"/><text x="668.7" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#14213d">11</text><rect x="696.0" y="140" width="54.7" height="46" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/><rect x="696.0" y="140" width="54.7" height="46" fill="url(#ph-pri)"/><text x="723.3" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">12</text><rect x="750.7" y="140" width="54.7" height="46" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/><rect x="750.7" y="140" width="54.7" height="46" fill="url(#ph-pri)"/><text x="778.0" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">13</text><rect x="805.3" y="140" width="54.7" height="46" fill="#1e40af" stroke="#ffffff" stroke-width="1.5"/><rect x="805.3" y="140" width="54.7" height="46" fill="url(#ph-pri)"/><text x="832.7" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">14</text><rect x="40" y="140" width="820.0" height="46" fill="none" stroke="#14213d" stroke-width="2"/><line x1="67.3" y1="128" x2="67.3" y2="140" stroke="#14213d" stroke-width="1.5"/><circle cx="67.3" cy="140" r="3.5" fill="#14213d"/><text x="55.3" y="124" text-anchor="start" font-family="Arial, sans-serif" font-