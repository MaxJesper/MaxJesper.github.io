" font-size="17" fill="#14213d">bakpulver 8–9</text><text x="231.3" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14213d">◀ SUR (pH under 7)</text><text x="450.0" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14213d">NEUTRAL</text><text x="668.7" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14213d">BASISK (pH över 7) ▶</text></svg>