<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" width="340" height="250" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Näringspyramid med tiondelsregeln</title>
  <desc>Fyra staplar: 10 000 kg växtplankton, 1 000 kg djurplankton, 100 kg strömming, 10 kg torsk. Mellan varje nivå går ungefär 10 procent vidare.</desc>
  <rect width="340" height="250" fill="#ffffff"/>
  <!-- nivåer, bredast längst ner -->
  <rect x="20"  y="190" width="240" height="44" rx="4" fill="#dbe8d2" stroke="#2f5228" stroke-width="2"/>
  <rect x="55"  y="140" width="170" height="44" rx="4" fill="#c3d9b4" stroke="#2f5228" stroke-width="2"/>
  <rect x="90"  y="90"  width="100" height="44" rx="4" fill="#a9c894" stroke="#2f5228" stroke-width="2"/>
  <rect x="115" y="40"  width="50"  height="44" rx="4" fill="#8fb777" stroke="#2f5228" stroke-width="2"/>
  <g font-size="13" fill="#1a1a2e" text-anchor="middle">
    <text x="140" y="209" font-weight="700">Växtplankton</text><text x="140" y="226">10 000 kg</text>
    <text x="140" y="159" font-weight="700">Djurplankton</text><text x="140" y="176">1 000 kg</text>
    <text x="140" y="109" font-weight="700">Strömming</text><text x="140" y="126">100 kg</text>
    <text x="140" y="59"  font-weight="700" font-size="12">Torsk</text><text x="140" y="76" font-size="12">10 kg</text>
  </g>
  <!-- pilar med 10 % -->
  <g stroke="#2f5228" stroke-width="2" fill="none">
    <path d="M272 212 C300 205 300 170 240 163"/><path d="M246 158 l-8 5 l9 3"/>
    <path d="M237 162 C265 155 265 120 205 113"/><path d="M211 108 l-8 5 l9 3"/>
    <path d="M202 112 C230 105 230 70 180 63"/><path d="M186 58 l-8 5 l9 3"/>
  </g>
  <g font-size="12" font-weight="700" fill="#2f5228">
    <text x="296" y="190">10 %</text><text x="261" y="140">10 %</text><text x="226" y="90">10 %</text>
  </g>
  <text x="20" y="22" font-size="13" font-weight="700" fill="#2f5228">Ca 90 % går åt på varje nivå</text>
</svg>
