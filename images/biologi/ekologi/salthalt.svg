<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Salthalt i haven runt Sverige</title>
  <desc>Bottenviken 0,3–0,4 %, Bottenhavet 0,5–0,6 %, Egentliga Östersjön 0,6–0,9 %, Västerhavet 1,5–3 %, världshaven ca 3,5 %. Streckad linje vid 3 % (saltvatten) och prickad vid 0,05 % (sötvatten).</desc>
  <rect width="340" height="300" fill="#ffffff"/>
  <!-- skala: x = 130 + procent*50  (0–4 %) -->
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="130" y1="30" x2="130" y2="240"/><line x1="180" y1="30" x2="180" y2="240"/>
    <line x1="230" y1="30" x2="230" y2="240"/><line x1="280" y1="30" x2="280" y2="240"/><line x1="330" y1="30" x2="330" y2="240"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="130" y="256">0 %</text><text x="180" y="256">1 %</text><text x="230" y="256">2 %</text><text x="280" y="256">3 %</text><text x="330" y="256">4 %</text>
  </g>
  <line x1="280" y1="24" x2="280" y2="240" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="132.5" y1="24" x2="132.5" y2="240" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="278" y="18" font-size="11" fill="#1e3a8a" text-anchor="end">saltvatten från ca 3 % →</text>
  <g font-size="12" fill="#1a1a2e" text-anchor="end">
    <text x="124" y="52">Bottenviken</text><text x="124" y="94">Bottenhavet</text>
    <text x="124" y="130">Egentliga</text><text x="124" y="144">Östersjön</text>
    <text x="124" y="178">Västerhavet</text><text x="124" y="220">Världshaven</text>
  </g>
  <!-- staplar: ljus del = spann -->
  <g stroke="#2f5228" stroke-width="1.5">
    <rect x="130" y="38" width="20" height="22" fill="#dbe8d2"/>
    <rect x="130" y="80" width="30" height="22" fill="#c3d9b4"/>
    <rect x="130" y="124" width="45" height="22" fill="#a9c894"/>
    <rect x="130" y="166" width="150" height="22" fill="#8fb777"/>
    <rect x="130" y="208" width="175" height="22" fill="#6f9a57"/>
  </g>
  <g font-size="11" fill="#1a1a2e">
    <text x="155" y="54">0,3–0,4 %</text><text x="165" y="96">0,5–0,6 %</text><text x="180" y="140">0,6–0,9 %</text>
    <text x="136" y="182">1,5–3 %</text><text x="136" y="224" font-weight="700">ca 3,5 %</text>
  </g>
  <text x="10" y="284" font-size="11" fill="#333">Sötvatten: under 0,05 % (prickad linje). Bräckt: 0,05–3 %.</text>
</svg>
