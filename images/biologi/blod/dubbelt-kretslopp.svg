<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 600" width="540" height="600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Det dubbla kretsloppet</title>
  <desc id="d">Schematisk bild. Höger kammare pumpar syrefattigt blod genom lungartären till lungorna (lilla kretsloppet). Syrerikt blod går genom lungvenerna till vänster förmak, vidare till vänster kammare som pumpar ut det i aortan till kroppens organ (stora kretsloppet). Syrefattigt blod kommer tillbaka genom hålvenerna till höger förmak. Heldragen linje betyder syrerikt blod, streckad linje syrefattigt blod.</desc>
  <defs>
    <marker id="pr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b4232a"/></marker>
    <marker id="pb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d4ed8"/></marker>
    <marker id="pg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#374151"/></marker>
  </defs>
  <rect width="540" height="600" fill="#ffffff"/>

  <!-- Rubriker för kretsloppen -->
  <text x="270" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">LILLA KRETSLOPPET (hjärta – lungor – hjärta)</text>
  <text x="270" y="590" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">STORA KRETSLOPPET (hjärta – kroppen – hjärta)</text>

  <!-- Lungorna -->
  <rect x="160" y="40" width="220" height="74" rx="14" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="270" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">LUNGORNA</text>
  <text x="270" y="92" text-anchor="middle" font-size="12.5" fill="#374151">blodet tar upp syre och</text>
  <text x="270" y="107" text-anchor="middle" font-size="12.5" fill="#374151">lämnar koldioxid</text>

  <!-- Kroppen -->
  <rect x="160" y="470" width="220" height="86" rx="14" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="270" y="498" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">KROPPENS ORGAN</text>
  <text x="270" y="520" text-anchor="middle" font-size="12.5" fill="#374151">blodet lämnar syre och näring,</text>
  <text x="270" y="536" text-anchor="middle" font-size="12.5" fill="#374151">tar upp koldioxid och avfall</text>

  <!-- Hjärtat: fyra rum. Hjärtats HÖGRA sida är till VÄNSTER i bilden (sett framifrån). -->
  <text x="146" y="196" text-anchor="start" font-size="13" font-weight="700" fill="#374151">HJÄRTAT (sett framifrån)</text>
  <rect x="146" y="206" width="104" height="70" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="198" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Höger</text>
  <text x="198" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">förmak</text>
  <rect x="146" y="300" width="104" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="198" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Höger</text>
  <text x="198" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">kammare</text>
  <rect x="290" y="206" width="104" height="70" rx="8" fill="#fef2f2" stroke="#b4232a" stroke-width="2.5"/>
  <text x="342" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Vänster</text>
  <text x="342" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">förmak</text>
  <rect x="290" y="300" width="104" height="96" rx="8" fill="#fef2f2" stroke="#b4232a" stroke-width="2.5"/>
  <text x="342" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Vänster</text>
  <text x="342" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">kammare</text>
  <!-- Skiljevägg -->
  
  <!-- Förmak till kammare (genom segelklaffarna) -->
  <line x1="198" y1="278" x2="198" y2="298" stroke="#374151" stroke-width="2.5" marker-end="url(#pg)"/>
  <line x1="342" y1="278" x2="342" y2="298" stroke="#374151" stroke-width="2.5" marker-end="url(#pg)"/>
  <text x="270" y="415" text-anchor="middle" font-size="11.5" fill="#374151">Klaffarna gör att blodet bara kan gå åt ett håll.</text>

  <!-- Lungartären: höger kammare -> lungorna (syrefattigt, streckad) -->
  <path d="M250 336 H270 V120" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#pb)"/>
  <rect x="176" y="150" width="86" height="22" rx="4" fill="#fff"/>
  <text x="219" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Lungartär</text>

  <!-- Lungvenerna: lungorna -> vänster förmak (syrerikt, heldragen) -->
  <path d="M380 78 H432 V240 H398" fill="none" stroke="#b4232a" stroke-width="4" marker-end="url(#pr)"/>
  <rect x="420" y="150" width="88" height="22" rx="4" fill="#fff"/>
  <text x="464" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Lungvener</text>

  <!-- Aortan: vänster kammare -> kroppen (syrerikt, heldragen) -->
  <path d="M394 348 H470 V512 H384" fill="none" stroke="#b4232a" stroke-width="4" marker-end="url(#pr)"/>
  <rect x="448" y="420" width="56" height="22" rx="4" fill="#fff"/>
  <text x="476" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Aorta</text>

  <!-- Hålvenerna: kroppen -> höger förmak (syrefattigt, streckad) -->
  <path d="M160 512 H70 V240 H142" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#pb)"/>
  <rect x="24" y="420" width="92" height="22" rx="4" fill="#fff"/>
  <text x="70" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Hålvenerna</text>

  <!-- Teckenförklaring -->
  <g transform="translate(150 438)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#b4232a" stroke-width="4"/>
    <text x="48" y="5" font-size="12.5" fill="#111827">syrerikt blod</text>
    <line x1="140" y1="0" x2="180" y2="0" stroke="#1d4ed8" stroke-width="4" stroke-dasharray="10 6"/>
    <text x="188" y="5" font-size="12.5" fill="#111827">syrefattigt blod</text>
  </g>
</svg>
