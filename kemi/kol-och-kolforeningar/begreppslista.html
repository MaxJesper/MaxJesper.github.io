<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Begreppslista – Kol och kolföreningar</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body.area-kol {
      --area: #7c3aed;
      --area-strong: #6d28d9;
      --area-soft: #f5f3ff;
      --area-border: #ddd6fe;
      --area-hover: #ede9fe;
    }

    main { max-width: 860px; margin: 0 auto; font-size: 1.05em; }

    .begrepp-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    .begrepp-table th { background: var(--area); color: #fff; text-align: left; padding: 0.6rem 0.8rem; font-size: 0.9rem; }
    .begrepp-table td { padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--area-border); vertical-align: top; }
    .begrepp-table tr:nth-child(even) td { background: var(--area-soft); }
    .begrepp-table td:first-child { font-weight: 700; white-space: nowrap; color: var(--area-strong); width: 30%; }

    .print-bar { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }

    @media print {
      .no-print { display: none !important; }
      header, nav, .hamburger { display: none !important; }
      body { font-size: 10pt; }
      main { max-width: 100%; }
      .begrepp-table th { background: #333 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .begrepp-table tr:nth-child(even) td { background: #f5f5f5 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      h1 { font-size: 16pt; }
    }
  </style>
</head>
<body class="area-kol">
  <header class="kemi-header">
    <h1>Begreppslista – Kol och kolföreningar</h1>
  </header>

  <button class="hamburger no-print" onclick="toggleMenu()">☰</button>
  <nav id="side-menu" class="no-print"></nav>

  <main>
    <div class="print-bar no-print">
      <a href="./" class="subject-btn">← Tillbaka</a>
      <button onclick="window.print()" class="subject-btn" style="cursor:pointer;">🖨️ Skriv ut / Spara som PDF</button>
    </div>

    <div class="lang-selector-mount" data-begrepp-base="./data/begrepp"></div>

    <p style="color:#555; font-size:0.95rem; margin-bottom:1.25rem;">
      Alla viktiga begrepp inom kol och kolföreningar med förklaringar. Används som stöd vid genomgångar och repetition.
    </p>

    <div id="begrepp-table-wrap">
      <p style="color:#888; font-size:0.9rem;">Laddar begrepp…</p>
    </div>
  </main>

  <script src="/js/menu.js" class="no-print"></script>
  <script src="/js/language-selector.js"></script>
  <script>
    function renderTable(data, lang) {
      var isSwedish = (!lang || lang === 'sv-SE');
      var html = '<table class="begrepp-table"><thead><tr>';
      html += '<th style="width:28%">Begrepp</th>';
      if (!isSwedish) html += '<th style="width:28%">Begrepp (övers.)</th>';
      html += '<th>Förklaring</th></tr></thead><tbody>';
      data.forEach(function(item) {
        html += '<tr><td>' + item.namn + '</td>';
        if (!isSwedish) html += '<td>' + (item.namn_native || '') + '</td>';
        html += '<td>' + item.definition + '</td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('begrepp-table-wrap').innerHTML = html;
    }

    var BEGREPP = [
      { "namn": "Organisk kemi", "definition": "Den gren av kemin som handlar om kolets föreningar. Kallas också kolföreningarnas kemi.", "anchor": "./studieguide.html#m1" },
      { "namn": "Kolatom", "definition": "Kolföreningarnas nyckelatom. En kolatom kan bilda fyra bindningar och kan därför kopplas ihop till kedjor, grenar och ringar – förklaringen till att det finns miljontals kolföreningar.", "anchor": "./studieguide.html#m1" },
      { "namn": "Strukturformel", "definition": "En bild som visar hur atomerna i en molekyl binder till varandra. Varje kolatom ritas med sina fyra bindningar (\"armar\").", "anchor": "./studieguide.html#m1" },
      { "namn": "Diamant", "definition": "En form av rent kol där varje kolatom är hårt bunden till fyra andra i alla riktningar. Det hårdaste ämne vi känner till – används i smycken och skärverktyg.", "anchor": "./studieguide.html#m2" },
      { "namn": "Grafit", "definition": "En form av rent kol där kolatomerna sitter i plana skikt som glider mot varandra. Mjukt och svärtar av sig – används i blyertsstift och som smörjmedel.", "anchor": "./studieguide.html#m2" },
      { "namn": "Fulleren", "definition": "En form av rent kol där kolatomerna bildar klotformade molekyler som liknar en fotboll. Upptäcktes på 1980–90-talet och är mycket stabil.", "anchor": "./studieguide.html#m2" },
      { "namn": "Aktivt kol", "definition": "Extremt poröst kol med enorm yta som kan suga åt sig färg-, lukt-, smak- och giftämnen. Finns i köksfläktar, gasmasker och som medicin vid förgiftning.", "anchor": "./studieguide.html#m2" },
      { "namn": "Kolväte", "definition": "En kolförening som bara innehåller kol och väte. De flesta bränslen är kolväten.", "anchor": "./studieguide.html#m3" },
      { "namn": "Alkan", "definition": "Ett mättat kolväte i metanserien, med bara enkelbindningar. Följer formeln CnH2n+2. De tio första är metan, etan, propan, butan, pentan, hexan, heptan, oktan, nonan och dekan.", "anchor": "./studieguide.html#m3" },
      { "namn": "Mättat kolväte", "definition": "Ett kolväte där kolatomerna bara har enkelbindningar och binder så många väteatomer som möjligt. Alkanerna är mättade.", "anchor": "./studieguide.html#m3" },
      { "namn": "Metanserien", "definition": "Alkanernas serie som börjar med metan och där varje nästa ämne har en kolatom till: metan, etan, propan, butan och så vidare.", "anchor": "./studieguide.html#m3" },
      { "namn": "Omättat kolväte", "definition": "Ett kolväte som innehåller en dubbel- eller trippelbindning mellan kolatomer. Alkener och alkyner är omättade.", "anchor": "./studieguide.html#m4" },
      { "namn": "Alken", "definition": "Ett omättat kolväte med en dubbelbindning mellan två kolatomer. Det enklaste är eten (C2H4), en råvara för plast.", "anchor": "./studieguide.html#m4" },
      { "namn": "Alkyn", "definition": "Ett omättat kolväte med en trippelbindning mellan två kolatomer. Det enklaste är etyn (C2H2), även kallat acetylen, som används vid svetsning.", "anchor": "./studieguide.html#m4" },
      { "namn": "Alkohol", "definition": "En kolförening där en väteatom bytts mot en OH-grupp. Namnges med ändelsen -ol. Metanol och etanol är de enklaste.", "anchor": "./studieguide.html#m5" },
      { "namn": "OH-grupp", "definition": "En hydroxylgrupp (en syreatom och en väteatom, −OH). Det är OH-gruppen som gör ett ämne till en alkohol.", "anchor": "./studieguide.html#m5" },
      { "namn": "Etanol", "definition": "Alkoholen i vin och sprit (C2H5OH). Bildas när jästsvampar omvandlar socker. Används också som lösningsmedel och bränsle.", "anchor": "./studieguide.html#m5" },
      { "namn": "Metanol", "definition": "Den enklaste alkoholen (CH3OH), även kallad träsprit. Mycket giftig – små mängder kan ge blindhet eller döden. Får aldrig förväxlas med etanol.", "anchor": "./studieguide.html#m5" },
      { "namn": "Flervärd alkohol", "definition": "En alkohol med flera OH-grupper. Två OH-grupper ger en tvåvärd alkohol (glykol), tre ger en trevärd (glycerol).", "anchor": "./studieguide.html#m6" },
      { "namn": "Glykol", "definition": "En tvåvärd alkohol (två OH-grupper). Sänker fryspunkten och används som frostskyddsmedel i bilkylare. Giftig.", "anchor": "./studieguide.html#m6" },
      { "namn": "Glycerol", "definition": "En trevärd alkohol (tre OH-grupper), även kallad glycerin. Ofarlig, söt och fuktbevarande – finns i hudkräm och livsmedel och ingår i fetter.", "anchor": "./studieguide.html#m6" },
      { "namn": "Organisk syra", "definition": "En kolförening med en karboxylgrupp (−COOH) som gör lösningen sur. Namnges med ändelsen -syra. Exempel: myrsyra och ättiksyra.", "anchor": "./studieguide.html#m7" },
      { "namn": "Karboxylgrupp", "definition": "Atomgruppen −COOH som kännetecknar en organisk syra. Den kan avge en vätejon och gör därför lösningen sur.", "anchor": "./studieguide.html#m7" },
      { "namn": "Ättiksyra", "definition": "En organisk syra (etansyra, CH3COOH) som ger ättika dess sura smak. Ättika är utspädd ättiksyra.", "anchor": "./studieguide.html#m7" },
      { "namn": "Ester", "definition": "Ett ämne som bildas när en alkohol reagerar med en organisk syra, samtidigt som vatten frigörs. Många estrar doftar frukt; fetter är estrar.", "anchor": "./studieguide.html#m8" },
      { "namn": "Förestring", "definition": "Reaktionen där en alkohol och en organisk syra bildar en ester och vatten.", "anchor": "./studieguide.html#m8" },
      { "namn": "Aminosyra", "definition": "En organisk syra där ett väte bytts mot en aminogrupp (−NH2). Har både en karboxylgrupp och en aminogrupp. Aminosyror är byggstenarna i proteiner.", "anchor": "./studieguide.html#m9" },
      { "namn": "Aminogrupp", "definition": "Atomgruppen −NH2 (en kvävegrupp) som tillsammans med karboxylgruppen kännetecknar en aminosyra.", "anchor": "./studieguide.html#m9" }
    ];

    renderTable(BEGREPP, 'sv-SE');

    window.addEventListener('begreppLangUpdate', function(e) {
      renderTable(e.detail.data, e.detail.lang);
    });
  </script>
</body>
</html>
