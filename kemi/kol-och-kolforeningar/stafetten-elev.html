<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stafetten – elev</title>
<style>
  :root{
    --bg:#AEC9DE; --surface:#FFFFFF; --surface-alt:#EAEFEA;
    --ink:#16211C; --ink-soft:#4B5850; --border:#C7D0D5;
    --accent:#2F7D5E; --accent-ink:#FFFFFF;
    --gold:#A9691A; --gold-line:#C98A2C; --gold-soft:#F7ECD8;
    --alert:#A23543; --alert-soft:#F7E7E5;
    --ratt:#2e9e5b; --ratt-l:#e4f6ea;
    --svar-a:#E69F00; --svar-b:#0072B2; --svar-c:#F0E442; --svar-d:#009E73;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  .stage{ max-width:640px; margin:0 auto; padding:22px 16px 60px; }
  .dold{ display:none !important; }

  /* --- inloggning --- */
  .login-yta{ background:var(--surface); border-radius:12px; padding:26px 22px; margin-top:60px; }
  .login-yta h1{ font-size:1.3rem; margin:0 0 4px; }
  .login-yta p{ color:var(--ink-soft); font-size:.9rem; margin:0 0 20px; }
  .falt{ margin-bottom:14px; }
  .falt label{ display:block; font-size:.82rem; color:var(--ink-soft); margin-bottom:4px; }
  .falt input{ width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px; font:inherit; font-size:1rem; }
  .knapp{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:6px; padding:12px 18px; font:inherit; font-size:1rem; font-weight:700; cursor:pointer; width:100%; }
  .knapp:disabled{ opacity:.5; cursor:default; }
  .knapp.sekundar{ background:var(--surface-alt); color:var(--ink); }
  .fel-text{ color:var(--alert); font-size:.85rem; margin-top:8px; }

  /* --- banner --- */
  .banner{
    background:var(--accent); color:var(--accent-ink);
    display:flex; justify-content:space-between; align-items:baseline;
    padding:14px 18px; border-radius:10px; margin-bottom:18px;
  }
  .banner .vanster{ display:flex; align-items:baseline; gap:10px; }
  .banner .lagnamn{ font-weight:700; font-size:1rem; }
  .banner .poang{ font-size:1.5rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .banner .sparat{ font-size:.8rem; opacity:.92; text-align:right; cursor:pointer; text-decoration:underline dotted; }
  .banner .sparat strong{ font-size:.95rem; }

  .timerspar{ height:8px; background:var(--surface-alt); border-radius:4px; overflow:hidden; margin-bottom:22px; }
  .timerfyllning{ height:100%; background:var(--accent); border-radius:4px; transition:width 1s linear; }

  .fraga-etikett{ font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
  .stold-etikett{ color:var(--gold); font-weight:700; }
  .stold-forklaring{ color:var(--gold); font-size:.92rem; font-weight:600; margin:2px 0 14px; }
  .fraga-text{ font-size:1.35rem; font-weight:700; line-height:1.3; margin:0 0 24px; }

  .svarsrutnat{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .svarsruta{
    display:flex; align-items:center; gap:12px;
    padding:18px 16px; border-radius:8px; border:none;
    color:#fff; font:inherit; font-size:1.02rem; font-weight:600; text-align:left;
    cursor:pointer;
  }
  .svarsruta .form{ width:22px; height:22px; flex:none; background:rgba(255,255,255,.95); }
  .r0 .form{ clip-path:polygon(50% 0%, 0% 100%, 100% 100%); } .r0{ background:var(--svar-a); }
  .r1 .form{ clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); } .r1{ background:var(--svar-b); }
  .r2 .form{ border-radius:50%; } .r2{ background:var(--svar-c); color:#16211C; }
  .r2 .form{ background:rgba(22,33,28,.85); }
  .r3 .form{ border-radius:3px; } .r3{ background:var(--svar-d); }
  .svarsruta.vald{ outline:3px solid var(--ink); outline-offset:2px; }
  .svarsruta:disabled{ opacity:.55; cursor:default; }

  .svarsrutnat-struktur{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .svarsruta-struktur{
    position:relative; background:var(--surface); border:2px solid var(--border); border-radius:8px;
    padding:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; min-height:110px;
  }
  .svarsruta-struktur svg{ width:100%; height:auto; max-height:96px; stroke:var(--ink); stroke-width:1.25; stroke-linecap:round; }
  .svarsruta-struktur svg text{ fill:var(--ink); stroke:none; font-family:Arial,sans-serif; }
  .svarsruta-struktur .horn{ position:absolute; top:8px; left:8px; width:20px; height:20px; }
  .svarsruta-struktur.r0 .horn{ background:var(--svar-a); clip-path:polygon(50% 0%, 0% 100%, 100% 100%); }
  .svarsruta-struktur.r1 .horn{ background:var(--svar-b); clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
  .svarsruta-struktur.r2 .horn{ background:var(--svar-c); border-radius:50%; }
  .svarsruta-struktur.r3 .horn{ background:var(--svar-d); border-radius:3px; }
  .svarsruta-struktur.vald{ border-color:var(--ink); }
  .svarsruta-struktur:disabled{ opacity:.6; cursor:default; }
  .svarsruta-struktur{ background:var(--surface); }

  .annons{ display:flex; align-items:center; justify-content:center; padding:80px 0; }
  .taggig-badge{
    width:250px; height:140px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#C98A2C,var(--gold));
    clip-path: polygon(50.0% 0.0%, 58.5% 13.0%, 71.7% 5.0%, 73.7% 20.3%, 89.1% 18.8%, 84.2% 33.5%, 98.7% 38.9%, 88.0% 50.0%, 98.7% 61.1%, 84.2% 66.5%, 89.1% 81.2%, 73.7% 79.7%, 71.7% 95.0%, 58.5% 87.0%, 50.0% 100.0%, 41.5% 87.0%, 28.3% 95.0%, 26.3% 79.7%, 10.9% 81.2%, 15.8% 66.5%, 1.3% 61.1%, 12.0% 50.0%, 1.3% 38.9%, 15.8% 33.5%, 10.9% 18.8%, 26.3% 20.3%, 28.3% 5.0%, 41.5% 13.0%);
    color:#fff; font-weight:800; font-size:1.15rem; text-transform:uppercase; letter-spacing:.03em;
    animation: blink-badge 0.7s steps(1,end) infinite;
  }
  @keyframes blink-badge{ 50%{ opacity:.35; } }

  .vantar-yta{ text-align:center; padding:60px 0; color:var(--ink-soft); }

  .resultat-kort{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:22px; text-align:center; }
  .resultat-kort.ratt{ border-color:var(--ratt); background:var(--ratt-l); }
  .resultat-kort.fel{ border-color:var(--alert); background:var(--alert-soft); }
  .resultat-poang{ font-size:2.4rem; font-weight:800; margin:6px 0; }
  .resultat-kort.ratt .resultat-poang{ color:var(--ratt); }
  .resultat-kort.fel .resultat-poang{ color:var(--alert); }
  .resultat-text{ color:var(--ink-soft); font-size:.95rem; }
  .facit-swatch{ display:inline-block; width:12px; height:12px; border-radius:3px; margin:0 6px -1px 0; }
  .facit-swatch.i0{ background:var(--svar-a); } .facit-swatch.i1{ background:var(--svar-b); }
  .facit-swatch.i2{ background:var(--svar-c); } .facit-swatch.i3{ background:var(--svar-d); }
  .facit-rad{ margin-top:8px; font-size:.9rem; }
  .stold-rad{ margin-top:14px; padding:12px 14px; background:var(--gold-soft); border:1px solid var(--gold-line); border-radius:6px; font-size:.9rem; text-align:left; display:flex; justify-content:space-between; gap:10px; }

  .stjal-yta{ background:var(--surface); border:2px solid var(--gold-line); border-radius:10px; padding:20px; margin-top:16px; }
  .stjal-yta h3{ margin:0 0 10px; font-size:1.05rem; }
  .lag-val{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .lag-val button{ text-align:left; padding:10px 12px; border-radius:6px; border:1px solid var(--border); background:var(--surface-alt); font:inherit; cursor:pointer; }
  .lag-val button:hover{ border-color:var(--gold-line); }

  .tavla{ display:flex; flex-direction:column; gap:14px; margin-top:10px; }
  .tavla-rad{ display:grid; grid-template-columns:26px 1fr auto; align-items:center; gap:12px; }
  .tavla-plac{ font-family:ui-monospace,monospace; color:var(--ink-soft); font-size:.9rem; }
  .tavla-stapelspar{ background:var(--surface-alt); border-radius:5px; overflow:hidden; height:34px; }
  .tavla-stapel{ height:100%; background:var(--accent); display:flex; align-items:center; padding-left:12px; color:#fff; font-weight:700; font-size:.92rem; border-radius:5px; }
  .tavla-poang{ font-family:ui-monospace,monospace; font-weight:700; text-align:right; min-width:52px; }
  .tavla-rad.ledare .tavla-stapel{ background:var(--gold); }
  .yta{ background:var(--surface); border-radius:12px; padding:18px; }

  /* --- Större skärmar (dator/lärplatta): mer luft, större text och rutor.
     Telefon-storleken ovan är medvetet oförändrad – den är redan lagom där. --- */
  @media (min-width: 700px){
    .stage{ max-width:1200px; padding:40px 28px 90px; }

    .login-yta{ max-width:620px; margin:80px auto 0; padding:48px 44px; }
    .login-yta h1{ font-size:2.4rem; }
    .login-yta p{ font-size:1.35rem; }
    .falt label{ font-size:1.1rem; }
    .falt input{ padding:18px 18px; font-size:1.4rem; }
    .knapp{ padding:19px 26px; font-size:1.4rem; }

    .banner{ padding:28px 36px; }
    .banner .lagnamn{ font-size:1.8rem; }
    .banner .poang{ font-size:3rem; }
    .banner .sparat{ font-size:1.3rem; }
    .banner .sparat strong{ font-size:1.7rem; }

    .fraga-etikett{ font-size:1.25rem; margin-bottom:10px; }
    .stold-forklaring{ font-size:1.3rem; }
    .fraga-text{ font-size:2.7rem; margin:0 0 36px; }

    .svarsrutnat, .svarsrutnat-struktur{ gap:22px; }
    .svarsruta{ padding:34px 30px; font-size:1.8rem; gap:20px; border-radius:14px; }
    .svarsruta .form{ width:38px; height:38px; }

    .svarsruta-struktur{ min-height:240px; padding:20px; border-radius:14px; }
    .svarsruta-struktur svg{ max-height:220px; }
    .svarsruta-struktur .horn{ width:34px; height:34px; top:16px; left:16px; }

    .taggig-badge{ width:420px; height:230px; font-size:2rem; }

    .resultat-kort{ padding:46px; border-radius:18px; }
    .resultat-poang{ font-size:4.2rem; }
    .resultat-text{ font-size:1.5rem; }
    .facit-rad{ font-size:1.35rem; }
    .stold-rad{ font-size:1.3rem; padding:20px 22px; }

    .stjal-yta{ padding:36px; }
    .stjal-yta h3{ font-size:1.7rem; }
    .lag-val button{ padding:17px 20px; font-size:1.3rem; }

    .tavla{ gap:20px; }
    .tavla-stapelspar{ height:54px; }
    .tavla-stapel{ font-size:1.3rem; padding-left:18px; }
    .tavla-poang{ font-size:1.25rem; min-width:70px; }
    .tavla-plac{ font-size:1.25rem; }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- INLOGGNING -->
  <div id="vy-login" class="login-yta">
    <h1>Stafetten</h1>
    <p>Skriv in rumskoden som läraren visar, och namnet på ert lag.</p>
    <div class="falt"><label>Rumskod</label><input id="in-kod" inputmode="numeric" maxlength="4" placeholder="1234"></div>
    <div class="falt"><label>Ditt namn</label><input id="in-namn" maxlength="24" placeholder="t.ex. Sigrid"></div>
    <div class="falt">
      <label>Lagnamn</label>
      <input id="in-lag" maxlength="24" placeholder="t.ex. Lag Elektronerna" list="lagnamn-lista" autocomplete="off">
      <datalist id="lagnamn-lista"></datalist>
    </div>
    <button class="knapp" id="btn-ga-med">Gå med</button>
    <div class="fel-text dold" id="login-fel"></div>
  </div>

  <!-- SPEL -->
  <div id="vy-spel" class="dold">
    <div class="banner">
      <div class="vanster"><span class="lagnamn" id="ban-lag"></span><span class="poang" id="ban-poang">0 p</span></div>
      <div class="sparat" id="ban-sparat" title="Klicka för att spendera">Sparade stöldpoäng<br><strong id="ban-sparat-belopp">0 p</strong></div>
    </div>

    <div id="vy-annons" class="annons dold"><div class="taggig-badge">Stöldfråga</div></div>

    <div id="vy-vantar-fraga" class="vantar-yta">Väntar på att läraren startar nästa fråga …</div>

    <div id="vy-fraga" class="dold">
      <div class="timerspar"><div class="timerfyllning" id="timer-fyllning" style="width:100%"></div></div>
      <p class="fraga-etikett dold" id="fraga-etikett"><span class="stold-etikett">⚡ Stöldfråga</span></p>
      <p class="stold-forklaring dold" id="stold-forklaring">Snabbast rätt får välja ett lag att stjäla från.</p>
      <p class="fraga-text" id="fraga-text"></p>
      <p class="stold-forklaring" id="vantar-pa-lagkompis" style="color:var(--ink-soft); font-weight:600;"></p>
      <div id="svarsomrade"></div>
      <button class="knapp dold" id="btn-skicka-flerval" style="margin-top:14px">Skicka svar</button>
      <div class="fel-text dold" id="svar-fel" style="margin-top:12px"></div>
    </div>

    <div id="vy-vantar-svar" class="vantar-yta dold">Ni har svarat — väntar på övriga lag …</div>

    <div id="vy-resultat" class="dold">
      <div class="resultat-kort" id="resultat-kort">
        <div class="resultat-text" id="resultat-text"></div>
        <div class="resultat-poang" id="resultat-poang"></div>
      </div>
      <div id="stjal-omrade"></div>
    </div>

    <div id="vy-tavla" class="dold">
      <div class="yta">
        <p class="fraga-etikett" style="text-align:center; margin-bottom:18px;">Ställning</p>
        <div class="tavla" id="tavla-omrade"></div>
      </div>
    </div>
  </div>

</div>

<script src="js/strukturformler.js"></script>
<script>
/* ====== Konfiguration ====== */
const API = "https://stafetten.jesper-tordsson.workers.dev";
const POLL_MS = 800; // hur ofta eleven kollar av nya frågor/resultat (sänkt från 2000 för snabbare respons)

/* ====== Tillstånd ====== */
let kod = null, mittLag = null, mittNamn = null;
let minTur = true; // uppdateras varje poll utifrån lagets turNu
let visadFragaId = null;      // senaste fraga-id vi ritat upp
let harSvaratForFraga = null; // fraga-id vi redan skickat svar för
let annonsVisadForFraga = null;
let valdaIndex = [];          // för flerval

const $ = sel => document.querySelector(sel);

/* ====== Byggarregister – kopplar en fråga-alternativs "struktur"-data till ritmotorn ====== */
const BYGGARE = { chain, alkohol, syra, polyol, glycerol, grenAlkan, esterBuild, aldehyd, keton, glycin };
function ritaStruktur(alt){
  const fn = BYGGARE[alt.byggare];
  if(!fn) return "<em>okänd struktur</em>";
  const g = fn(...(alt.args||[]));
  return renderSVG(g, alt.xscale||1, null); // ingen gruppmarkering i quizläge, se tidigare beslut
}

async function api(path, method, body){
  const res = await fetch(API + path, {
    method, headers: body ? {"Content-Type":"application/json"} : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.fel || ("HTTP "+res.status)); }
  return res.json();
}

// Föreslå redan existerande lagnamn i rummet som en dropdown (datalist) när eleven skrivit
// in rumskoden – annars är det lätt att stava fel och råka hamna i ett nytt, tomt lag
// istället för att gå med i sina lagkompisars.
let lagforslagTimer = null;
async function uppdateraLagforslag(){
  const k = $("#in-kod").value.trim();
  if(!/^\d{4}$/.test(k)) { $("#lagnamn-lista").innerHTML = ""; return; }
  try{
    const state = await api(`/rum/${k}`, "GET");
    $("#lagnamn-lista").innerHTML = Object.keys(state.lag).map(namn =>
      `<option value="${namn.replace(/"/g,"&quot;")}"></option>`).join("");
  }catch(e){ $("#lagnamn-lista").innerHTML = ""; /* fel/okänd rumskod – inga förslag än */ }
}
$("#in-kod").addEventListener("input", () => {
  clearTimeout(lagforslagTimer);
  lagforslagTimer = setTimeout(uppdateraLagforslag, 300);
});
// Hämta färska förslag precis när eleven ska välja lag, ifall fler lag hunnit skapas sedan.
$("#in-lag").addEventListener("focus", uppdateraLagforslag);

$("#btn-ga-med").addEventListener("click", async () => {
  const k = $("#in-kod").value.trim();
  const namn = $("#in-namn").value.trim();
  const lag = $("#in-lag").value.trim();
  $("#login-fel").classList.add("dold");
  if(!/^\d{4}$/.test(k) || !namn || !lag){ $("#login-fel").textContent = "Fyll i en 4-siffrig rumskod, ditt namn och ett lagnamn."; $("#login-fel").classList.remove("dold"); return; }
  try{
    await api(`/rum/${k}/gaMed`, "POST", {lag, spelare:namn});
    kod = k; mittLag = lag; mittNamn = namn;
    $("#vy-login").classList.add("dold");
    $("#vy-spel").classList.remove("dold");
    pollLoop();
  }catch(e){
    $("#login-fel").textContent = "Kunde inte gå med: " + e.message;
    $("#login-fel").classList.remove("dold");
  }
});

$("#ban-sparat").addEventListener("click", () => visaSpenderaSparat());

async function pollLoop(){
  try{
    const state = await api(`/rum/${kod}`, "GET");
    uppdatera(state);
  }catch(e){ /* nätverksglapp: försök igen nästa gång, stör inte eleven med felmeddelanden */ }
  setTimeout(pollLoop, POLL_MS);
}

function uppdatera(state){
  const migLag = state.lag[mittLag] || {poang:0, sparatStold:0, senasteResultat:null, turNu:null};
  $("#ban-lag").textContent = mittLag;
  $("#ban-poang").textContent = migLag.poang + " p";
  $("#ban-sparat-belopp").textContent = migLag.sparatStold + " p";
  // Om turNu saknas (t.ex. inga medlemmar registrerade) släpper vi igenom alla, precis
  // som workern gör – hellre än att låsa laget helt.
  minTur = !migLag.turNu || migLag.turNu === mittNamn;
  const vantarEl = $("#vantar-pa-lagkompis");
  vantarEl.classList.toggle("dold", minTur);
  if(!minTur) vantarEl.textContent = `Väntar på att ${migLag.turNu} i ert lag svarar …`;

  const f = state.aktuellFraga;
  if(!f){
    visaEndast("vy-vantar-fraga");
    return;
  }

  if(f.id !== visadFragaId){
    // Ny fråga sedan sist – nollställ lokalt tillstånd för den
    visadFragaId = f.id; harSvaratForFraga = null; valdaIndex = [];
    if(f.typ === "stold" && annonsVisadForFraga !== f.id){
      annonsVisadForFraga = f.id;
      visaEndast("vy-annons");
      setTimeout(() => renderFraga(f), 4000);
      return;
    }
    renderFraga(f);
    return;
  }

  if(f.sammanstalld){
    renderResultat(state, f, migLag);
  } else if(harSvaratForFraga === f.id){
    visaEndast("vy-vantar-svar");
  }
  // annars: redan ritad frågevy, låt eleven vara ifred medan hen funderar
}

function visaEndast(id){
  ["vy-annons","vy-vantar-fraga","vy-fraga","vy-vantar-svar","vy-resultat","vy-tavla"].forEach(x=>{
    $("#"+x).classList.toggle("dold", x!==id);
  });
}

let tidsutTimer = null;
function renderFraga(f){
  visaEndast("vy-fraga");
  $("#svar-fel").classList.add("dold");
  $("#fraga-etikett").classList.toggle("dold", f.typ==="vanlig");
  $("#stold-forklaring").classList.toggle("dold", f.typ!=="stold");
  $("#fraga-text").textContent = f.text || "(fråga saknar text)";
  // Räkna ut hur många sekunder som är kvar av svarstiden just nu (t.ex. om eleven
  // laddar om sidan eller fick "annons"-skärmen visad ett tag) så att baren alltid
  // visar den verkliga, server-satta deadline:en – inte en hårdkodad gissning.
  const kvar = f.deadline ? Math.max(0, (f.deadline - Date.now()) / 1000) : 45;
  $("#timer-fyllning").style.transition = "none";
  $("#timer-fyllning").style.width = "100%";
  requestAnimationFrame(()=>{
    $("#timer-fyllning").style.transition = `width ${kvar}s linear`;
    $("#timer-fyllning").style.width = "0%";
  });

  // Stäng av svarsknapparna själva när tiden går ut, istället för att låta eleven klicka
  // "i onödan" och bara få ett tyst nekat svar från servern (se skickaSvarRaw).
  if(tidsutTimer) clearTimeout(tidsutTimer);
  tidsutTimer = setTimeout(() => {
    if(harSvaratForFraga === f.id) return; // redan skickat svar innan tiden gick ut
    [...document.querySelectorAll("#svarsomrade button")].forEach(b => b.disabled = true);
    $("#btn-skicka-flerval").disabled = true;
    if(minTur){
      $("#svar-fel").textContent = "Tiden är ute — inget svar hanns skickas.";
      $("#svar-fel").classList.remove("dold");
    }
  }, kvar*1000);

  const omr = $("#svarsomrade");
  omr.innerHTML = "";
  const arStruktur = f.alternativ.length && f.alternativ[0].typ === "struktur";
  omr.className = arStruktur ? "svarsrutnat-struktur" : "svarsrutnat";
  const raknarklass = ["r0","r1","r2","r3"];

  f.alternativ.forEach((alt, i) => {
    const knapp = document.createElement("button");
    knapp.className = (arStruktur ? "svarsruta-struktur " : "svarsruta ") + raknarklass[i % 4];
    if(arStruktur){
      knapp.innerHTML = `<span class="horn"></span>${ritaStruktur(alt)}`;
    } else {
      knapp.innerHTML = `<span class="form"></span>${alt.text}`;
    }
    knapp.disabled = !minTur; // bara den vars tur det är får klicka – lagkompisar ser och kan hjälpa till
    knapp.addEventListener("click", () => valAlternativ(f, i, knapp));
    omr.appendChild(knapp);
  });
  $("#btn-skicka-flerval").classList.toggle("dold", !f.flerval);
  $("#btn-skicka-flerval").disabled = !minTur;
}

function valAlternativ(f, i, knapp){
  if(!minTur) return; // extra skydd, knappen ska redan vara disabled
  if(f.flerval){
    knapp.classList.toggle("vald");
    valdaIndex = [...knapp.parentElement.children].map((k,ix)=>k.classList.contains("vald")?ix:-1).filter(ix=>ix>=0);
  } else {
    skickaSvar(f, [i]);
  }
}
$("#btn-skicka-flerval").addEventListener("click", () => {
  if(!minTur) return;
  if(valdaIndex.length) skickaSvarRaw(valdaIndex);
});
function skickaSvar(f, svar){ skickaSvarRaw(svar); }
async function skickaSvarRaw(svar){
  // OBS: vi markerar INTE "har svarat" och byter INTE vy förrän servern faktiskt bekräftat
  // svaret (200 OK). Annars kan ett svar som nekas (t.ex. tiden hann ta slut, eller turen
  // hann gå vidare) se ut som att det gick igenom, fast poängen aldrig delades ut.
  $("#svar-fel").classList.add("dold");
  try{
    await api(`/rum/${kod}/svara`, "POST", {lag:mittLag, spelare:mittNamn, svar});
    harSvaratForFraga = visadFragaId;
    if(tidsutTimer) clearTimeout(tidsutTimer);
    visaEndast("vy-vantar-svar");
  }catch(e){
    const text = (e.message||"").includes("tiden") ? "Tiden hann ta slut — svaret registrerades inte."
      : (e.message||"").includes("tur") ? "Hann inte i tid — det var inte längre er tur."
      : ("Kunde inte skicka svaret (" + e.message + "). Försök igen om det fortfarande går.");
    $("#svar-fel").textContent = text;
    $("#svar-fel").classList.remove("dold");
  }
}

function renderResultat(state, f, migLag){
  visaEndast("vy-resultat");
  const r = migLag.senasteResultat;
  const kort = $("#resultat-kort");
  const andring = (r && r.fragaId===f.id) ? (r.poangandring||0) : 0;
  // Rätt/fel avgörs av det faktiska svaret (från lärarens sammanställning), inte av
  // poängändringen – annars ser ett bestulet lag ut att ha svarat fel fast de hade rätt.
  const varRatt = !!(f.resultat && f.resultat.rattaLag && f.resultat.rattaLag.includes(mittLag));
  kort.className = "resultat-kort " + (varRatt ? "ratt" : "fel");

  const rattSvarHtml = (f.rattSvar || []).map(i => {
    const alt = f.alternativ[i];
    const txt = (alt && alt.typ === "struktur") ? `alternativ ${i+1}` : (alt ? alt.text : "?");
    return `<span class="facit-swatch i${i % 4}"></span>${txt}`;
  }).join(", ");

  $("#resultat-text").innerHTML = (varRatt ? "Rätt svar!" : "Fel svar.") +
    `<div class="facit-rad">Rätt var: ${rattSvarHtml}</div>`;
  $("#resultat-poang").textContent = (andring>=0?"+":"") + andring;

  const stjalOmr = $("#stjal-omrade");
  stjalOmr.innerHTML = "";
  if(r && r.fragaId===f.id && r.stoldFran){
    stjalOmr.innerHTML = `<div class="stold-rad"><span>Ni stal av <strong>${r.stoldFran}</strong></span><span>+${andring} p</span></div>`;
  } else if(r && r.fragaId===f.id && r.stoldAv){
    stjalOmr.innerHTML = `<div class="stold-rad"><span><strong>${r.stoldAv}</strong> stal av er</span><span>${andring} p</span></div>`;
  }

  // Väntar vårt lag på ett stöldbeslut?
  if(f.stoldPending && f.stoldPending.lag === mittLag && !f.stoldPending.beslutat){
    const andraLag = Object.keys(state.lag).filter(l=>l!==mittLag);
    const val = document.createElement("div");
    val.className = "stjal-yta";
    val.innerHTML = `<h3>⚡ Ni fick stöldrätt! Välj lag att stjäla från:</h3><div class="lag-val"></div>
      <button class="knapp sekundar" id="btn-spara-stold">Spara poängen till senare istället</button>`;
    const lagVal = val.querySelector(".lag-val");
    andraLag.forEach(l=>{
      const b = document.createElement("button");
      b.textContent = l + " (" + state.lag[l].poang + " p)";
      b.addEventListener("click", async ()=>{ await api(`/rum/${kod}/stjalBeslut`,"POST",{lag:mittLag, mal:l}); });
      lagVal.appendChild(b);
    });
    val.querySelector("#btn-spara-stold").addEventListener("click", async ()=>{
      await api(`/rum/${kod}/stjalBeslut`,"POST",{lag:mittLag, spara:true});
    });
    stjalOmr.appendChild(val);
  }
}

function visaSpenderaSparat(){
  if(!kod) return;
  api(`/rum/${kod}`, "GET").then(state=>{
    const mig = state.lag[mittLag];
    if(!mig || mig.sparatStold<=0){ alert("Inga sparade stöldpoäng att spendera än."); return; }
    const andraLag = Object.keys(state.lag).filter(l=>l!==mittLag);
    const malNamn = prompt("Spendera " + mig.sparatStold + " sparade stöldpoäng mot vilket lag?\n" + andraLag.join(", "));
    if(malNamn && andraLag.includes(malNamn)){
      api(`/rum/${kod}/spenderaSparat`, "POST", {lag:mittLag, mal:malNamn});
    }
  });
}
</script>
