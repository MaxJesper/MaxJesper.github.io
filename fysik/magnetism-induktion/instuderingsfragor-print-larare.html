<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instuderingsfrågor – Magnetism och induktion (Lärare)</title>
  <link rel="stylesheet" href="/css/style.css?v=43b4cdef" />
  <link rel="stylesheet" href="/css/instudering.css?v=050bacdb" />
</head>

<body>
  <header class="fysik-header">
    <h1>Instuderingsfrågor</h1>
    <p>Magnetism och induktion – lärare</p>
  </header>

  <button class="hamburger" onclick="toggleMenu()">☰</button>
  <nav id="side-menu"></nav>

  <main>
    <div id="study-container"></div>
  </main>

  <script src="/js/menu.js?v=d9464f7b"></script>
  <script src="/js/render-instudering.js?v=b2529d1a"></script>
  <script>
    renderStudySet({
      jsonPath: "./data/instuderingsfragor.json",
      mountId: "study-container",
      mode: "print-teacher"
    });

    function autoPrintAndClose() {
      window.addEventListener("afterprint", () => {
        try { window.close(); } catch (e) {}
      });

      setTimeout(() => {
        try { window.close(); } catch (e) {}
      }, 2500);

      window.print();
    }

    window.addEventListener("load", () => {
      setTimeout(autoPrintAndClose, 350);
    });
  </script>
</body>
</html>
