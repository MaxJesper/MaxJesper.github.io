<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instuderingsfrågor (Lärare) – Universum</title>
  <link rel="stylesheet" href="/css/style.css?v=43b4cdef" />
  <link rel="stylesheet" href="/css/instudering.css?v=050bacdb" />
</head>

<body>
  <header class="fysik-header">
    <h1>Instuderingsfrågor – Lärarkopia</h1>
    <p>Universum</p>
  </header>

  <main id="instudering-container"></main>

  <script src="/js/render-instudering.js?v=1ff11eaf"></script>
  <script>
    renderInstudering({
      jsonPath: "data/instuderingsfragor.json",
      mountId: "instudering-container",
      mode: "print-larare",
      title: "Instuderingsfrågor – Lärarkopia"
    });

    function autoPrintAndClose() {
      window.addEventListener("afterprint", () => {
        try { window.close(); } catch (e) {}
      });
      setTimeout(() => { try { window.close(); } catch (e) {} }, 2500);
      window.print();
    }

    window.addEventListener("load", () => setTimeout(autoPrintAndClose, 350));
  </script>
</body>
</html>
