<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Övningsprov – Atomfysik (Utskrift)</title>
  <link rel="stylesheet" href="/css/style.css?v=3258155f" />
  <link rel="stylesheet" href="/css/prov.css?v=a8aa49c5" />
  <style>
    .formelblad {
      background: #eef2fb; border: 1px solid #cdd9f0; border-left: 4px solid #2e4a8a;
      border-radius: 10px; padding: 0.9rem 1.1rem; margin-bottom: 1.25rem;
    }
    .formelblad h2 { margin: 0 0 0.5rem 0; font-size: 1.1rem; color: #2e4a8a; }
    .formelblad ul {
      margin: 0; padding-left: 1.1rem; columns: 2; column-gap: 1.5rem;
      list-style: square;
    }
    .formelblad li { margin: 0.2rem 0; break-inside: avoid; }
    @media (max-width: 520px) { .formelblad ul { columns: 1; } }
  </style>
</head>

<body>
  <header class="fysik-header">
    <h1>Övningsprov</h1>
    <p>Atomfysik</p>
  </header>

  <main>
    <div class="print-note">
      <div class="print-field">
        <span class="print-label">Namn:</span>
        <span class="print-line print-line-name"></span>
      </div>
      <div class="print-field">
        <span class="print-label">Klass:</span>
        <span class="print-line print-line-class"></span>
      </div>
    </div>
    <div id="prov-container"></div>
  </main>

  <script src="/js/render-prov.js?v=cb7986cb"></script>
  <script>
    renderProv({
      jsonPath: "./data/ovningsprov.json",
      mountId: "prov-container",
      mode: "print-exam"
    });

    function autoPrintAndClose() {
      window.addEventListener("afterprint", () => {
        try { window.close(); } catch (e) {}
      });
      setTimeout(() => { try { window.close(); } catch (e) {} }, 2500);
      window.print();
    }

    window.addEventListener("load", () => setTimeout(autoPrintAndClose, 350));
  </script>
</body>
</html>
