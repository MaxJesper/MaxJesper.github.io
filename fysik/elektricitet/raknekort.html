<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Räknekort: Elektricitet – Fysik</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    :root { --area: #1d4ed8; --area-bg: #eff6ff; --area-line: #3b82f6; }

    .rk-topbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .rk-intro { max-width: 820px; margin-bottom: 1.25rem; color: #333; }

    .rk-valjare-rubrik { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--area); margin-bottom: 0.4rem; }
    .rk-valjare { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem; }
    .rk-omr-btn { border: 1px solid #cbb98f; background: #fff; color: #333; border-radius: 999px; padding: 0.4rem 0.9rem; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
    .rk-omr-btn.aktiv { background: var(--area); border-color: var(--area); color: #fff; }

    .rk-scen { max-width: 760px; margin: 0 auto; }

    .raknekort { background: #fff; border: 1px solid #e2d6bf; border-top: 6px solid var(--area-line); border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.07); padding: 1.5rem 1.5rem 1.75rem; min-height: 300px; }

    .rk-huvud { display: flex; align-items: center; justify-content: space-between; gap: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.6rem; margin-bottom: 1rem; }
    .rk-omrade { font-weight: 800; color: var(--area); font-size: 1.05rem; }
    .rk-typ { font-size: 0.8rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: #555; background: var(--area-bg); border: 1px solid #f0e2c4; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }

    .rk-fraga { font-size: 1.3rem; font-weight: 700; line-height: 1.45; }
    .rk-hint { color: #888; font-style: italic; margin-top: 1rem; font-size: 0.98rem; }

    .rk-rad { margin-bottom: 1rem; }
    .rk-rad:last-child { margin-bottom: 0; }
    .rk-etikett { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--area); margin-bottom: 0.3rem; }

    .rk-formel { font-family: "Cambria Math", Georgia, "Times New Roman", serif; font-size: 1.2rem; background: var(--area-bg); border-left: 4px solid var(--area-line); border-radius: 0 8px 8px 0; padding: 0.45rem 0.9rem; margin-bottom: 0.35rem; }
    .rk-svar { font-family: "Cambria Math", Georgia, "Times New Roman", serif; font-size: 1.25rem; font-weight: 700; color: #14532d; background: #dcfce7; border: 1px solid #86efac; border-radius: 8px; padding: 0.5rem 0.9rem; display: inline-block; }
    .rk-forklaring { font-size: 1.02rem; color: #333; line-height: 1.5; }

    .rk-controls { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.25rem; }
    .rk-controls button { padding: 0.6rem 1.1rem; border-radius: 8px; border: 1px solid #cbb98f; background: #fff; color: #111; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .rk-controls button.primar { background: var(--area); border-color: var(--area); color: #fff; }
    .rk-controls button:disabled { opacity: 0.45; cursor: default; }

    .rk-progress { font-weight: 700; color: #555; font-variant-numeric: tabular-nums; }
    .hidden { display: none; }
    sub { font-size: 0.7em; }
  </style>
</head>

<body>

<header class="fysik-header">
  <h1>Räknekort</h1>
  <p>Elektricitet och Ohms lag</p>
</header>

<button class="hamburger" onclick="toggleMenu()">☰</button>
<nav id="side-menu"></nav>

<main>
  <div class="rk-topbar">
    <a href="./index.html" class="subject-btn">← Tillbaka</a>
    <span class="rk-progress" id="progress">–</span>
  </div>

  <p class="rk-intro" id="intro"></p>

  <div class="rk-valjare-rubrik">Välj område</div>
  <div class="rk-valjare" id="valjare"></div>

  <div class="rk-scen">
    <div class="raknekort" id="card">
      <div class="rk-huvud">
        <span class="rk-omrade" id="omradeLabel">Laddar …</span>
        <span class="rk-typ" id="typLabel"></span>
      </div>

      <div id="fram"></div>
      <div class="hidden" id="baksida"></div>
    </div>

    <div class="rk-controls">
      <button id="prevBtn" type="button">← Föregående</button>
      <button id="flipBtn" type="button" class="primar">Vänd kortet</button>
      <button id="nextBtn" type="button">Nästa →</button>
    </div>
  </div>
</main>

<script src="/js/menu.js"></script>

<script>
  const JSON_PATH = "./data/raknekort.json";
  let omraden = [];
  let omrIndex = 0;
  let kortIndex = 0;
  let flipped = false;

  const el = (id) => document.getElementById(id);
  function escapeHtml(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
  function fmtFormel(s){ return escapeHtml(s).replaceAll("E_p","E<sub>p</sub>").replaceAll("E_k","E<sub>k</sub>"); }
  function formelBlock(arr){ return (arr||[]).map(f => `<div class="rk-formel">${fmtFormel(f)}</div>`).join(""); }

  function nuvarandeKort(){ return omraden[omrIndex].kort[kortIndex]; }

  function renderValjare(){
    const v = el("valjare"); v.innerHTML = "";
    omraden.forEach((o,i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "rk-omr-btn" + (i===omrIndex ? " aktiv" : "");
      b.textContent = o.namn;
      b.addEventListener("click", () => { omrIndex = i; kortIndex = 0; flipped = false; render(); });
      v.appendChild(b);
    });
  }

  function render(){
    const omr = omraden[omrIndex];
    const k = nuvarandeKort();
    if(!k) return;

    el("omradeLabel").textContent = omr.namn;
    el("typLabel").textContent = (k.typ === "formel") ? "Formel" : "Uppgift";

    // Framsida
    let fram = "";
    if(k.typ === "formel"){
      fram += `<div class="rk-rad"><div class="rk-etikett">${escapeHtml(k.titel || "Formel")}</div>${formelBlock(k.formel)}</div>`;
      fram += `<p class="rk-hint">Vänd kortet för en förklaring.</p>`;
    } else {
      fram += `<div class="rk-fraga">${escapeHtml(k.fraga)}</div>`;
      fram += `<p class="rk-hint">Försök själv först – vänd sedan för uträkning och svar.</p>`;
    }
    el("fram").innerHTML = fram;

    // Baksida
    let bak = "";
    if(k.typ === "formel"){
      bak += `<div class="rk-rad"><div class="rk-etikett">Formel</div>${formelBlock(k.formel)}</div>`;
      bak += `<div class="rk-rad"><div class="rk-etikett">Förklaring</div><div class="rk-forklaring">${escapeHtml(k.forklaring||"")}</div></div>`;
    } else {
      bak += `<div class="rk-rad"><div class="rk-etikett">Formel</div>${formelBlock(k.formel)}</div>`;
      bak += `<div class="rk-rad"><div class="rk-etikett">Uträkning</div>${formelBlock(k.utrakning)}</div>`;
      bak += `<div class="rk-rad"><div class="rk-etikett">Svar</div><div class="rk-svar">${fmtFormel(k.svar||"")}</div></div>`;
      if(k.forklaring) bak += `<div class="rk-rad"><div class="rk-etikett">Förklaring</div><div class="rk-forklaring">${escapeHtml(k.forklaring)}</div></div>`;
    }
    el("baksida").innerHTML = bak;

    el("fram").classList.toggle("hidden", flipped);
    el("baksida").classList.toggle("hidden", !flipped);
    el("flipBtn").textContent = flipped ? "Dölj svaret" : "Vänd kortet";

    el("progress").textContent = `Kort ${kortIndex+1} av ${omr.kort.length}`;
    renderValjare();
  }

  function next(){ const n = omraden[omrIndex].kort.length; kortIndex = (kortIndex+1)%n; flipped = false; render(); }
  function prev(){ const n = omraden[omrIndex].kort.length; kortIndex = (kortIndex-1+n)%n; flipped = false; render(); }
  function flip(){ flipped = !flipped; render(); }

  el("nextBtn").addEventListener("click", next);
  el("prevBtn").addEventListener("click", prev);
  el("flipBtn").addEventListener("click", flip);
  document.addEventListener("keydown", (e) => {
    if(e.key === "ArrowRight") next();
    else if(e.key === "ArrowLeft") prev();
    else if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); }
  });

  window.addEventListener("load", async () => {
    try{
      const res = await fetch(JSON_PATH, { cache: "no-store" });
      if(!res.ok) throw new Error("Kunde inte läsa " + JSON_PATH + " (" + res.status + ")");
      const data = await res.json();
      omraden = Array.isArray(data.omraden) ? data.omraden : [];
      if(data.intro) el("intro").textContent = data.intro;
      render();
    }catch(err){
      console.error(err);
      el("omradeLabel").textContent = "Fel";
      el("fram").textContent = "Det gick inte att ladda räknekorten.";
    }
  });
</script>

</body>
</html>
